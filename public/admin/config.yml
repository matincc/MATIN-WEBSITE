# Matin admin (Sveltia CMS, https://github.com/sveltia/sveltia-cms). Each "Save" creates a
# commit on the main branch; Netlify then rebuilds and publishes the site (a few minutes).
# Sign in with a GitHub account that has write access to the repository (see GUIDE_ADMIN.md).
backend:
  name: github
  repo: matincc/MATIN-WEBSITE
  branch: main
  commit_messages:
    create: 'Admin: add {{collection}} “{{slug}}”'
    update: 'Admin: update {{collection}} “{{slug}}”'
    delete: 'Admin: delete {{collection}} “{{slug}}”'
    uploadMedia: 'Admin: upload “{{path}}”'
    deleteMedia: 'Admin: delete “{{path}}”'

site_url: https://matincc.ca
display_url: https://matincc.ca
logo:
  src: /icons/logo-512.png

# Default media folder (videos); images go next to each collection, see below.
media_folder: public/media
public_folder: /media

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ---------------------------------------------------------------- News
  - name: news
    label: News · Actualités
    label_singular: News item
    description: >-
      Only APPROVED news goes here: anything saved is published on matincc.ca within a few
      minutes (one Netlify build). Proposed or rejected stories never go here, because the
      repository is public. Cultural News needs its source and region; write a short summary
      in Matin's own words, never a copied article. To take an item off the site, tick
      "Archived". Persian appears only once "Persian text reviewed" is ticked.
    folder: src/content/news
    extension: yaml
    format: yaml
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{urlSlug.en}}'
    media_folder: /src/assets/uploads/news
    public_folder: ../../assets/uploads/news
    summary: '{{date}} · {{category}} · {{title.en}}'
    sortable_fields: [date, category]
    fields:
      - name: category
        label: Section
        widget: select
        options:
          - { label: 'Cultural News (external, with source)', value: recommends }
          - { label: 'Matin News (the institute)', value: matin-news }
      - name: region
        label: Region (Cultural News only)
        widget: select
        required: false
        options:
          - { label: Montréal, value: montreal }
          - { label: 'Canada (rest of Québec included)', value: canada }
          - { label: Around the World, value: international }
      - { name: date, label: 'Publication date (for Cultural News, the source''s date)', widget: datetime, time_format: false, format: YYYY-MM-DD }
      - { name: updated, label: Updated on (optional), widget: datetime, time_format: false, format: YYYY-MM-DD, required: false }
      - name: source
        label: Original source (Cultural News)
        widget: object
        required: false
        fields:
          - { name: name, label: Publisher, widget: string }
          - name: url
            label: Link to the original article (https://…)
            widget: string
            pattern: ['^https://[^\s]+$', 'Must start with https://']
      - name: title
        label: Headline
        widget: object
        fields:
          - { name: fr, label: Français, widget: string }
          - { name: en, label: English, widget: string }
          - { name: fa, label: فارسی (optional), widget: string, required: false }
      - name: urlSlug
        label: Web address (lowercase words joined by hyphens)
        widget: object
        fields:
          - { name: fr, label: Français, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Lowercase letters, digits and hyphens only'] }
          - { name: en, label: English, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Lowercase letters, digits and hyphens only'] }
      - name: excerpt
        label: Short summary (Matin's own words, 1 to 3 sentences)
        widget: object
        fields:
          - { name: fr, label: Français, widget: text }
          - { name: en, label: English, widget: text }
          - { name: fa, label: فارسی (optional), widget: text, required: false }
      - name: body
        label: Text
        widget: object
        fields:
          - { name: fr, label: Français, widget: markdown }
          - { name: en, label: English, widget: markdown }
          - { name: fa, label: فارسی (optional), widget: markdown, required: false }
      - name: author
        label: Signature
        widget: object
        fields:
          - { name: fr, label: Français, widget: string, default: 'Institut interculturel Matin' }
          - { name: en, label: English, widget: string, default: 'Matin Intercultural Institute' }
          - { name: fa, label: فارسی, widget: string, default: 'مؤسسه میان‌فرهنگی متین' }
      - { name: image, label: Image (only with the right to use it), widget: image, required: false }
      - name: imageAlt
        label: Image description (for screen readers)
        widget: object
        required: false
        fields:
          - { name: fr, label: Français, widget: string, required: false }
          - { name: en, label: English, widget: string, required: false }
          - { name: fa, label: فارسی, widget: string, required: false }
      - { name: imageCredit, label: 'Image credit and licence (e.g. Photo: Jane Doe, CC BY 4.0)', widget: string, required: false }
      - { name: imagePermission, label: Matin may use this image (owner or written permission), widget: boolean, required: false }
      - { name: faReviewed, label: Persian text reviewed (shows the Persian page), widget: boolean, default: false, required: false }
      - { name: archived, label: Archived (taken off the site), widget: boolean, default: false, required: false }

  # ---------------------------------------------------------------- Gallery
  - name: gallery
    label: Gallery · Galerie
    label_singular: Album
    description: >-
      One album per activity. Only real Matin photos and videos, published with the consent
      of the photographer and of the people who can be recognized. Tick "Featured" on up to
      five photos or videos to show them in "Matin Moments" on the homepage.
    folder: src/content/gallery
    extension: yaml
    format: yaml
    create: true
    delete: true
    slug: '{{year}}-{{month}}-{{day}}-{{hour}}{{minute}}'
    media_folder: /src/assets/uploads/gallery
    public_folder: ../../assets/uploads/gallery
    summary: '{{date}} · {{title.en}}'
    sortable_fields: [date, order]
    fields:
      - name: title
        label: Title
        widget: object
        fields:
          - { name: fr, label: Français, widget: string }
          - { name: en, label: English, widget: string }
      - { name: date, label: Date, widget: datetime, time_format: false, format: YYYY-MM-DD }
      - name: location
        label: Place (optional)
        widget: object
        required: false
        fields:
          - { name: fr, label: Français, widget: string, required: false }
          - { name: en, label: English, widget: string, required: false }
      - name: description
        label: Short description (optional)
        widget: object
        required: false
        fields:
          - { name: fr, label: Français, widget: text, required: false }
          - { name: en, label: English, widget: text, required: false }
      - name: isEvent
        label: Album of a Matin event (listed under "Events")
        widget: boolean
        default: false
      - name: cover
        label: Cover image (optional; otherwise the first photo)
        widget: image
        required: false
        accept: image/jpeg,image/png,image/webp
      - name: photos
        label: Photos
        label_singular: Photo
        widget: list
        required: false
        summary: '{{fields.alt.en}}'
        fields:
          - { name: image, label: 'Photo (JPEG, PNG or WebP)', widget: image, accept: 'image/jpeg,image/png,image/webp' }
          - name: alt
            label: Description for people who cannot see the photo
            widget: object
            fields:
              - { name: fr, label: Français, widget: string }
              - { name: en, label: English, widget: string }
          - name: caption
            label: Caption (optional)
            widget: object
            required: false
            fields:
              - { name: fr, label: Français, widget: string, required: false }
              - { name: en, label: English, widget: string, required: false }
          - { name: featured, label: Featured on the homepage, widget: boolean, default: false }
      - name: videos
        label: Videos
        label_singular: Video
        widget: list
        required: false
        summary: '{{fields.title.en}}'
        fields:
          - name: title
            label: Title
            widget: object
            fields:
              - { name: fr, label: Français, widget: string }
              - { name: en, label: English, widget: string }
          - name: youtube
            label: YouTube link (recommended)
            widget: string
            required: false
            pattern:
              - '^(|[\w-]{11}|https://(www\.|m\.)?(youtube\.com/(watch\?v=|shorts/|embed/)|youtu\.be/)[\w-]{11}\S*)$'
              - 'Paste a YouTube link, e.g. https://www.youtube.com/watch?v=…'
          - name: file
            label: Or a short video file (MP4 or WebM, under 50 MB)
            widget: file
            required: false
            accept: video/mp4,video/webm
            media_folder: /public/media
            public_folder: /media
          - { name: thumbnail, label: Still image before playing (optional), widget: image, required: false, accept: 'image/jpeg,image/png,image/webp' }
          - { name: featured, label: Featured on the homepage, widget: boolean, default: false }
      - name: consent
        label: I confirm Matin may publish these photos and videos (people's consent obtained)
        widget: boolean
        default: false
      - { name: order, label: Order (lower first), widget: number, value_type: int, default: 100 }
      - { name: draft, label: Unpublished (hidden from the site), widget: boolean, default: false }

  # ---------------------------------------------------------------- Intro video
  - name: intro
    label: Intro video · Vidéo de présentation
    description: >-
      Matin's introductory video ("Matin is Born"). It appears large on the homepage and at
      the top of the Gallery as soon as a YouTube link or a video file is added.
    files:
      - name: matin-is-born
        label: Matin is Born
        file: src/content/intro-video/matin-is-born.yaml
        media_folder: /src/assets/uploads/gallery
        public_folder: ../../assets/uploads/gallery
        fields:
          - name: title
            label: Title
            widget: object
            fields:
              - { name: fr, label: Français, widget: string }
              - { name: en, label: English, widget: string }
          - name: youtube
            label: YouTube link (recommended)
            widget: string
            required: false
            pattern:
              - '^(|[\w-]{11}|https://(www\.|m\.)?(youtube\.com/(watch\?v=|shorts/|embed/)|youtu\.be/)[\w-]{11}\S*)$'
              - 'Paste a YouTube link, e.g. https://www.youtube.com/watch?v=…'
          - name: file
            label: Or a video file (MP4 or WebM, under 50 MB)
            widget: file
            required: false
            accept: video/mp4,video/webm
            media_folder: /public/media
            public_folder: /media
          - { name: thumbnail, label: Still image before playing (optional), widget: image, required: false, accept: 'image/jpeg,image/png,image/webp' }

  # ---------------------------------------------------------------- Directory
  - name: resources
    label: Cultural Resources & Organizations
    label_singular: Organization
    description: >-
      A curated directory, never a list of partners. Publish an organization only once its
      official name, website and logo have been checked.
    folder: src/content/resources
    extension: yaml
    format: yaml
    create: true
    delete: true
    slug: '{{name}}'
    identifier_field: name
    media_folder: /src/assets/uploads/resources
    public_folder: ../../assets/uploads/resources
    summary: '{{name}} · {{category}}'
    sortable_fields: [name, category, order]
    fields:
      - { name: name, label: Official name, widget: string }
      - { name: nameEn, label: English name (only if the organization uses one), widget: string, required: false }
      - name: category
        label: Category
        widget: select
        options:
          - { label: Canadian Municipal Cultural Institutions, value: municipal }
          - { label: Québec Cultural Institutions, value: quebec }
          - { label: Canadian Federal Cultural Institutions, value: federal }
          - { label: Major Cultural & Community Organizations and Institutions, value: community }
          - { label: International Cultural Organizations & Networks, value: international }
      - name: url
        label: Official website (https://…)
        widget: string
        pattern: ['^https://[^\s]+$', 'Enter the full address, starting with https://']
      - { name: logo, label: 'Official logo (PNG, SVG, JPEG or WebP)', widget: image, required: false, accept: 'image/png,image/svg+xml,image/jpeg,image/webp' }
      - name: label
        label: Short clickable name on the card (e.g. CALQ)
        widget: object
        required: false
        fields:
          - { name: fr, label: Français, widget: string, required: false }
          - { name: en, label: English, widget: string, required: false }
      - name: kind
        label: Kind, only where useful (e.g. Municipal public body)
        widget: object
        required: false
        fields:
          - { name: fr, label: Français, widget: string, required: false }
          - { name: en, label: English, widget: string, required: false }
          - { name: fa, label: فارسی, widget: string, required: false }
      - name: description
        label: Short description
        widget: object
        required: false
        fields:
          - { name: fr, label: Français, widget: text, required: false }
          - { name: en, label: English, widget: text, required: false }
          - { name: fa, label: فارسی, widget: text, required: false }
      - { name: order, label: Order within the category (lower first), widget: number, value_type: int, default: 100 }
      - { name: published, label: Published on the site, widget: boolean, default: false }

  # "A Personal Note From Our Founder" on the About page: approved texts of October 21,
  # 2026 (the Persian text is the source). Paragraphs are separated by a blank line.
  message:
    fr: |
      « Mes années de travail dans le domaine de la culture et mon expérience de vie dans deux sociétés différentes m'ont appris qu'une simple conversation, une nouvelle rencontre ou même le fait d'écouter l'histoire de quelqu'un peut parfois changer notre façon de voir le monde.

      Pour moi, Matin est bien plus que le nom d'un institut. C'est le début d'une nouvelle expérience : une occasion de se retrouver, de poser des questions, de s'écouter et d'apprendre les uns des autres.

      Nous n'en sommes qu'au début de cette aventure. Nous ne savons pas exactement où elle nous mènera, mais nous savons que nous souhaitons la partager avec davantage de personnes.

      Ce serait un plaisir de vous compter parmi nous. »
    en: |
      "Years of working in culture and living in two different societies have taught me that sometimes a simple conversation, a new connection, or even listening to someone else's story can change the way we see the world.

      For me, Matin is more than the name of an institute. It marks the beginning of something new — a chance to sit together, ask questions, listen, and learn from one another.

      We're only at the beginning of this journey. We don't know exactly where it will take us, but we know we want to share it with more people along the way.

      We'd be delighted to have you be part of it."
    fa: |
      «سال‌ها کار در حوزه فرهنگ و زندگی در دو جامعه متفاوت به من یاد داده است که گاهی یک گفت‌وگوی ساده، یک آشنایی تازه یا حتی شنیدن داستان زندگی دیگری می‌تواند نگاه ما را به جهان تغییر دهد.

      متین برای من فقط نام یک مؤسسه نیست؛ آغاز تجربه‌ای تازه است. فرصتی برای کنار هم نشستن، پرسیدن، شنیدن و آموختن از یکدیگر.

      ما تازه در ابتدای راه هستیم. نمی‌دانیم این مسیر ما را دقیقاً به کجا خواهد برد، اما می‌دانیم که می‌خواهیم آن را با آدم‌های بیشتری تجربه کنیم.

      خوشحال می‌شویم شما هم بخشی از این مسیر باشید.»
  # Signature under the message.
  signature:
    fr: 'Fondateur et président, Institut interculturel Matin'
    en: 'Founder & President, Matin Intercultural Institute'
    fa: 'بنیان‌گذار و رئیس مؤسسه میان‌فرهنگی متین'

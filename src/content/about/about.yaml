vision:
  fr: "Nous croyons que la diversité culturelle est l'une des plus grandes forces d'une société. Matin imagine un avenir où chaque personne, quelle que soit son origine, est accueillie, respectée et en mesure de participer pleinement à la vie sociale, culturelle et citoyenne, et où le dialogue entre les cultures nourrit la confiance, l'équité et la solidarité entre les générations."
  en: "We believe cultural diversity is one of society's greatest strengths. Matin envisions a future in which people of every origin are welcomed, respected, and able to take part fully in social, cultural, and civic life, and in which dialogue between cultures leads to trust, equity, and lasting solidarity across generations."
values:
  - icon: dialogue
    title: { fr: 'Dialogue', en: 'Dialogue', fa: 'گفت‌وگو' }
    text:
      fr: "Nous écoutons d'abord, partageons nos histoires et apprenons les uns des autres."
      en: 'We listen first, share our stories, and learn from one another.'
      fa: 'گوش دادن، روایت کردن و آموختن از یکدیگر.'
  - icon: respect
    title: { fr: 'Respect', en: 'Respect', fa: 'احترام' }
    text:
      fr: 'Nous accueillons chaque personne avec dignité, dans toute son unicité.'
      en: 'We welcome every person with dignity, in all their uniqueness.'
      fa: 'پذیرفتن هر انسان با کرامت و با همه ویژگی‌های یگانه‌اش.'
  - icon: openness
    title: { fr: 'Ouverture', en: 'Openness', fa: 'گشودگی' }
    text:
      fr: 'Nous restons curieux et ouverts à la découverte des autres.'
      en: 'We stay curious and open to discovering others.'
      fa: 'پرورش کنجکاوی و شوق شناختن دیگری.'
  - icon: creativity
    title: { fr: 'Créativité', en: 'Creativity', fa: 'خلاقیت' }
    text:
      fr: "Nous faisons de l'art et de la culture des ponts entre les personnes."
      en: 'We use art and culture as bridges between people.'
      fa: 'هنر و فرهنگ را به پل‌هایی میان مردم بدل کردن.'
  - icon: community
    title: { fr: 'Communauté', en: 'Community', fa: 'همبستگی اجتماعی' }
    text:
      fr: 'Nous bâtissons des liens durables, ici à Montréal et au-delà.'
      en: 'We build lasting connections, here in Montréal and beyond.'
      fa: 'ساختن پیوندهای ماندگار با هم، همین‌جا در مونترال.'
  - icon: equity
    title: { fr: 'Équité', en: 'Equity', fa: 'برابری' }
    text:
      fr: 'Nous œuvrons pour rendre nos activités accessibles au plus grand nombre.'
      en: 'We work to make our activities accessible to as many people as possible.'
      fa: 'دسترس‌پذیر کردن فعالیت‌هایمان برای هرچه بیشتر مردم.'
history:
  - year: '2026'
    title: { fr: 'Matin voit le jour', en: 'Matin is born' }
    text:
      fr: "En 2026, l'Institut interculturel Matin commence son histoire à Montréal. Nous sommes jeunes, et c'est notre force : tout reste à construire. Nous partons avec une mission claire, une vision partagée et des valeurs qui nous tiennent à cœur, et nous bâtissons les partenariats, les programmes et la communauté qui leur donneront vie. Venez écrire les premières pages avec nous."
      en: 'In 2026, Matin Intercultural Institute begins its story in Montréal. We are new, and that is our strength: everything is still ahead of us. We start with a clear mission, a shared vision, and values we hold dear, and we are building the partnerships, programs, and community that will bring them to life. Come write the first pages with us.'

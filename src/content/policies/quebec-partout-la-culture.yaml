# original-language title in all three languages; description only from the official text.
title:
  fr: 'Politique culturelle Partout, la culture'
publisher: 'Gouvernement du Québec'
year: 2018
jurisdiction: quebec
url: https://cdn-contenu.quebec.ca/cdn-contenu/adm/min/culture-communications/publications-adm/politique/Partoutlaculture_Polculturelle_Web.pdf
description:
  fr: "« Que la culture soit partout : voilà le grand objectif de cette politique culturelle. » Ses quatre orientations : contribuer à l’épanouissement individuel et collectif grâce à la culture ; façonner un environnement propice à la création et au rayonnement des arts et de la culture ; dynamiser la relation entre la culture et le territoire ; accroître l’apport de la culture et des communications à l’économie et au développement du Québec."
  en: "“Culture everywhere: that is the main objective of this cultural policy.” Its four orientations: contribute to individual and collective fulfilment through culture; shape an environment conducive to the creation and reach of the arts and culture; strengthen the relationship between culture and the territory; increase the contribution of culture and communications to Québec’s economy and development."
  fa: '«اینکه فرهنگ همه‌جا باشد: هدف بزرگ این سیاست فرهنگی همین است.» چهار جهت‌گیری آن: کمک به شکوفایی فردی و جمعی از راه فرهنگ؛ ساختن محیطی مناسب برای آفرینش و درخشش هنر و فرهنگ؛ پویا کردن پیوند میان فرهنگ و سرزمین؛ و افزایش سهم فرهنگ و ارتباطات در اقتصاد و توسعهٔ کبک.'

description:
  fr: "Le principal outil de planification de la Ville de Montréal jusqu’en 2030. Il fixe six orientations : des milieux de vie exceptionnels, une métropole prospère et vivante, l’habitation pour tous et un filet social solide, une mobilité planifiée et inclusive, une ville verte et résiliente, et une administration performante."
  en: "The City of Montréal’s main planning tool through 2030. It sets six priorities: exceptional living environments, a prosperous and vibrant metropolis, housing for all and a robust social safety net, planned and inclusive mobility, a green and resilient city, and efficient municipal management."
  fa: 'اصلی‌ترین ابزار برنامه‌ریزی شهرداری مونترال تا سال ۲۰۳۰. این برنامه شش جهت‌گیری دارد: محیط‌های زندگی برجسته، کلان‌شهری شکوفا و پویا، مسکن برای همه و شبکهٔ حمایت اجتماعی قوی، جابه‌جایی برنامه‌ریزی‌شده و فراگیر، شهری سبز و تاب‌آور، و مدیریت شهری کارآمد.'

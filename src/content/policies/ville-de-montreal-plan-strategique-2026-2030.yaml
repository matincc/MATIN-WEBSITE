title:
  fr: 'Plan stratégique : Agir pour Montréal 2026-2030'
publisher: 'Ville de Montréal'
year: 2026
jurisdiction: montreal
url: https://montreal.ca/articles/plan-strategique-agir-pour-montreal-2026-2030-8318
description:
  fr: "Le plan stratégique constitue le principal outil de planification de la Ville de Montréal. Il établit les grandes orientations qui guideront les décisions, les investissements et l’action municipale jusqu’en 2030 : des milieux de vie exceptionnels pour la population ; une métropole prospère et vibrante ; des logements pour toutes et tous et un filet social robuste ; une mobilité planifiée, efficace et inclusive ; une ville verte, résiliente et durable ; une administration publique performante."
  en: "The strategic plan is the City of Montréal’s main planning tool. It sets out the broad orientations that will guide municipal decisions, investments and action until 2030: exceptional living environments for the population; a prosperous and vibrant metropolis; housing for all and a robust social safety net; planned, efficient and inclusive mobility; a green, resilient and sustainable city; a high-performing public administration."
  fa: 'برنامهٔ راهبردی، اصلی‌ترین ابزار برنامه‌ریزی شهرداری مونترال است. این برنامه جهت‌گیری‌های کلانی را تعیین می‌کند که تصمیم‌ها، سرمایه‌گذاری‌ها و اقدامات شهرداری را تا سال ۲۰۳۰ هدایت خواهند کرد: محیط‌های زندگی برجسته برای مردم؛ کلان‌شهری شکوفا و پویا؛ مسکن برای همه و شبکهٔ حمایت اجتماعی قوی؛ جابه‌جایی برنامه‌ریزی‌شده، کارآمد و فراگیر؛ شهری سبز، تاب‌آور و پایدار؛ و دستگاه اداری کارآمد.'

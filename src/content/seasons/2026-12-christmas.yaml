greeting:
  fr: "Au temps des Fêtes, Montréal s'illumine et la ville ralentit un peu. C'est un moment pour se retrouver, partager et penser aux autres. Matin souhaite à toutes et à tous de joyeuses Fêtes et de beaux moments avec leurs proches."
  en: "During the holiday season, Montréal lights up and the city slows down a little. It is a time to come together, to share and to think of others. Matin wishes everyone happy holidays and warm moments with their loved ones."
  fa: "در روزهای تعطیلات پایان سال، مونترال چراغانی می‌شود و شهر کمی آرام‌تر می‌شود. این روزها زمان دور هم بودن، سهیم شدن و به فکر دیگران بودن است. متین برای همه تعطیلاتی خوش و لحظه‌هایی گرم در کنار عزیزانشان آرزو می‌کند."

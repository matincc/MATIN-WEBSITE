  fr: "Le 25 décembre, les familles chrétiennes de Montréal célèbrent Noël, et toute la ville s'illumine. Pour beaucoup, c'est le temps de se retrouver, de partager et de penser aux autres. Matin souhaite un joyeux Noël à celles et à ceux qui le célèbrent, et de belles fêtes à tous."
  en: "On December 25, Montréal's Christian families celebrate Christmas, and the whole city lights up. For many, it is a time to come together, to share and to think of others. Matin wishes a merry Christmas to all who celebrate it, and happy holidays to everyone."
  fa: "در ۲۵ دسامبر، خانواده‌های مسیحی مونترال کریسمس را جشن می‌گیرند و همهٔ شهر چراغانی می‌شود. برای بسیاری، این روزها زمان دور هم بودن، سهیم شدن و به فکر دیگران بودن است. متین کریسمس را به همهٔ کسانی که آن را جشن می‌گیرند تبریک می‌گوید و برای همه روزهای خوشی آرزو می‌کند."

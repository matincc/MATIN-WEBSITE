greeting:
  fr: "Le 8 novembre, de nombreuses familles de Montréal, notamment d'origine sud-asiatique, célèbrent Divali, la fête des lumières. Les petites lampes allumées aux fenêtres parlent de lumière, d'espoir et de renouveau. Matin souhaite une fête lumineuse et paisible à toutes celles et à tous ceux qui la célèbrent."
  en: "On November 8, many Montréal families, especially of South Asian origin, celebrate Diwali, the festival of lights. The small lamps lit in the windows speak of light, hope and renewal. Matin wishes a bright and peaceful celebration to everyone who marks it."
  fa: "در ۸ نوامبر، بسیاری از خانواده‌های مونترال، به‌ویژه خانواده‌هایی با ریشه در جنوب آسیا، دیوالی، جشن نورها، را جشن می‌گیرند. چراغ‌های کوچکی که پشت پنجره‌ها روشن می‌شوند از روشنایی، امید و نو شدن می‌گویند. متین برای همهٔ کسانی که این جشن را برگزار می‌کنند، جشنی روشن و آرام آرزو می‌کند."

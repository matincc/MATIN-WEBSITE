  fr: "Du 4 au 12 décembre, les familles juives de Montréal célèbrent Hanoukka, la fête des lumières : chaque soir, une nouvelle flamme s'allume. Matin souhaite à toutes celles et à tous ceux qui la célèbrent des soirées chaleureuses et lumineuses."

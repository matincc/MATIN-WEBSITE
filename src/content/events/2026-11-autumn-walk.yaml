title:
  fr: "Une promenade d'automne pour se rencontrer"
  en: 'An Autumn Walk, A Chance to Connect'
  fa: 'یک پیاده‌روی پاییزی، فرصتی برای آشنایی'
summary:
  fr: "Parfois, une simple promenade suffit pour engager une belle conversation. Joignez-vous à l'Institut interculturel Matin pour une promenade automnale au parc Angrignon, à LaSalle. Une occasion de profiter des couleurs de l'automne, de faire de nouvelles rencontres, d'échanger et de passer un moment agréable dans une ambiance conviviale."
  en: 'Sometimes, a simple walk is all it takes to start a conversation. Join Matin Intercultural Institute for an autumn walk in Angrignon Park, LaSalle. An opportunity to enjoy the colours of the season, meet new people, share stories, and connect in a relaxed and welcoming atmosphere.'
  fa: 'گاهی یک پیاده‌روی ساده می‌تواند آغاز یک گفت‌وگوی خوب باشد. مؤسسه میان‌فرهنگی متین شما را به یک پیاده‌روی پاییزی در پارک آنگرینیون لاسال دعوت می‌کند؛ فرصتی برای لذت بردن از رنگ‌های پاییز، آشنایی با افراد جدید، شنیدن داستان‌های یکدیگر و گذراندن لحظاتی دوستانه در فضایی صمیمی.'

  en: |
    **Free activity, open to everyone.**

    Conversations will be in French.

    Part of the Semaine québécoise des rencontres interculturelles 2026.

    Inquiries: [matincc.mtl@gmail.com](mailto:matincc.mtl@gmail.com)
  fa: |
    **این برنامه رایگان است و شرکت در آن برای همه آزاد است.**

    گفت‌وگوها به زبان فرانسوی خواهد بود.

    این برنامه بخشی از «هفتهٔ دیدارهای بین‌فرهنگی کبک ۲۰۲۶» است.

    برای اطلاعات بیشتر: [matincc.mtl@gmail.com](mailto:matincc.mtl@gmail.com)

summary:
  fr: "Parfois, une simple promenade suffit pour engager une belle conversation. Joignez-vous à l'Institut interculturel Matin pour une promenade automnale au parc Angrignon, à LaSalle. Une occasion de profiter des couleurs de l'automne, de faire de nouvelles rencontres, d'échanger et de passer un moment agréable dans une ambiance conviviale."
  en: 'Sometimes, a simple walk is all it takes to start a conversation. Join Matin Intercultural Institute for an autumn walk in Angrignon Park, LaSalle. An opportunity to enjoy the colours of the season, meet new people, share stories, and connect in a relaxed and welcoming atmosphere.'
  fa: 'گاهی یک پیاده‌روی ساده می‌تواند آغاز یک گفت‌وگوی خوب باشد. مؤسسه میان‌فرهنگی متین شما را به یک پیاده‌روی پاییزی در پارک آنگرینیون لاسال دعوت می‌کند؛ فرصتی برای لذت بردن از رنگ‌های پاییز، آشنایی با افراد جدید، شنیدن داستان‌های یکدیگر و گذراندن لحظاتی دوستانه در فضایی صمیمی.'
body:
  fr: |
    **Activité gratuite, ouverte à toutes et à tous, en famille et entre amis.**

    ## Programme

    - **13 h 45** · Accueil et boisson chaude
    - **14 h** · Promenade d'automne
    - **14 h 45 à 15 h 30** · Cercle de conversation : partagez une tradition d'automne de votre pays

    Rendez-vous : entrée principale du parc, près du métro Angrignon.

    Les échanges se dérouleront en français.

    À l'occasion de la Semaine québécoise des rencontres interculturelles 2026.

    Renseignements : [info@matincc.ca](mailto:info@matincc.ca)
  en: |
    **Free activity, open to everyone: bring your family and friends.**

    ## Program

    - **1:45 p.m.** · Welcome and hot drink
    - **2:00 p.m.** · Autumn walk
    - **2:45 to 3:30 p.m.** · Conversation circle: share an autumn tradition from your country

    Meeting point: main park entrance, near Angrignon metro.

    Conversations will be in French.

    On the occasion of the Semaine québécoise des rencontres interculturelles 2026.

    Inquiries: [info@matincc.ca](mailto:info@matincc.ca)
  fa: |
    **این برنامه رایگان است و شرکت در آن برای همه، همراه با خانواده و دوستان، آزاد است.**

    ## برنامه

    - **۱۳:۴۵** · خوشامدگویی و نوشیدنی گرم
    - **۱۴:۰۰** · پیاده‌روی پاییزی
    - **۱۴:۴۵ تا ۱۵:۳۰** · حلقهٔ گفت‌وگو: یک رسم پاییزی سرزمین خودتان را با ما در میان بگذارید

    محل دیدار: ورودی اصلی پارک، کنار مترو آنگرینیون.

    گفت‌وگوها به زبان فرانسوی خواهد بود.

    به مناسبت «هفتهٔ دیدارهای بین‌فرهنگی کبک ۲۰۲۶».

    برای اطلاعات بیشتر: [info@matincc.ca](mailto:info@matincc.ca)

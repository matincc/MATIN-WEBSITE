summary:
  fr: "Une semaine d'activités partout au Québec, sous le thème « Le Québec en commun », pour favoriser les rencontres et le partage entre Québécoises et Québécois de toutes origines. Le calendrier des activités est publié par le gouvernement du Québec."
  en: 'A week of activities across Québec, under the theme "Le Québec en commun," that brings together Quebecers of all origins to meet and share. The calendar of activities is published by the Government of Québec.'
  fa: 'یک هفته برنامه در سراسر کبک با شعار «کبکِ مشترک» (Le Québec en commun)، برای دیدار و هم‌سخنی کبکی‌ها از همهٔ خاستگاه‌ها. تقویم برنامه‌ها را دولت کبک منتشر می‌کند.'
whyItMatters:

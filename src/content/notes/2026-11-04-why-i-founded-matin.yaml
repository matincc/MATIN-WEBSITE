text:
  en: |
    Matin was not born of a single moment of inspiration. It is the outcome of many years of practice: first in cultural planning in my country of origin, and later through my involvement with community councils and cultural planning bodies in Montréal.

    That experience led me to a clear conclusion. There was room for a different kind of institution: lean, responsive and intellectually rigorous, something closer to a cultural start-up, fully accountable to the law yet free from the conventions that so often constrain our sector.

    It also revealed a structural gap. In many organizations, cultural decisions rest with a small circle of people. Residents are invited to attend events, but seldom asked what culture means to them, what they actually need, or where programming could genuinely serve them. In several Montréal boroughs where I have worked, the same familiar faces return to every activity, while a large share of the population remains unaware that these programs and community spaces exist for them, and are funded by their own taxes.

    I never set out to build a technology company or an import-export business. My aim was to continue, in Canada, the professional path I had followed for years. As many immigrants know, re-establishing oneself in one's own field is a demanding process, and it required me to set aside other economic opportunities. My commitment today is to place that knowledge and experience at the service of the community.

    The name carries two meanings. In Persian, "Matin" describes a person who is composed, trustworthy, kind and seasoned. In French, "matin" is the morning: the close of the night and the beginning of a new day.

    We deliberately chose a light structure over a heavy hierarchy. Matin Intercultural Institute was registered as a non-profit organization in Québec, Canada, in October 2026. Since then, we have established our first Advisory Circle, launched "Culture in Plain Words", a programme of 100 concise learning articles on our website, and organized our first community walk in Parc Angrignon.

    This pace does not come at the expense of rigour. Registration was one milestone within a plan that was already in motion well before it.

    Regardless of gender, background, origin or language, each of us has something to learn from other cultures, something worth sharing from our own, and a stake in building common ground through dialogue in Canada's multicultural society. That is the mission of Matin Intercultural Institute.

    I would welcome the opportunity to connect with anyone who shares this vision.
  fr: |
    Matin n’est pas né d’un éclair d’inspiration. Il est le fruit de longues années de pratique : d’abord en planification culturelle dans mon pays d’origine, puis au sein de conseils communautaires et d’organismes de planification culturelle à Montréal.

    Cette expérience m’a conduit à une conclusion claire. Il y avait place pour une institution d’un autre type : légère, réactive et rigoureuse sur le plan intellectuel, plus proche d’une jeune pousse culturelle, pleinement respectueuse de la loi, mais affranchie des conventions qui freinent si souvent notre milieu.

    Elle a aussi mis en lumière une lacune structurelle. Dans bien des organisations, les décisions culturelles reposent entre les mains d’un cercle restreint. On invite les résidents à assister aux activités, mais on leur demande rarement ce que la culture représente pour eux, ce dont ils ont réellement besoin, ou là où une programmation pourrait vraiment les servir. Dans plusieurs arrondissements de Montréal où j’ai travaillé, ce sont souvent les mêmes visages qui reviennent à chaque activité, alors qu’une grande partie de la population ignore que ces programmes et ces lieux communautaires existent pour elle et sont financés par ses propres impôts.

    Je n’ai jamais cherché à fonder une entreprise technologique ni une société d’import-export. Mon but était de poursuivre, au Canada, le parcours professionnel que je mène depuis des années. Comme beaucoup d’immigrants le savent, retrouver sa place dans son propre domaine est un chemin exigeant, et j’ai dû renoncer à d’autres occasions économiques. Mon engagement aujourd’hui est de mettre ce savoir et cette expérience au service de la collectivité.

    Le nom porte deux sens. En persan, « Matin » désigne une personne posée, digne de confiance, bienveillante et expérimentée. En français, le matin est la fin de la nuit et le début d’un jour nouveau.

    Nous avons choisi à dessein une structure légère plutôt qu’une hiérarchie lourde. L’Institut interculturel Matin a été constitué en organisme à but non lucratif au Québec, Canada, en octobre 2026. Depuis, nous avons formé notre premier Cercle des conseillers, lancé « La culture en mots simples », un programme de 100 textes courts de découverte sur notre site, et organisé notre première marche communautaire au parc Angrignon.

    Ce rythme ne se fait pas au détriment de la rigueur. La constitution n’était qu’une étape d’un plan déjà bien engagé.

    Quels que soient notre genre, notre parcours, notre origine ou notre langue, chacun de nous a quelque chose à apprendre des autres cultures, quelque chose à partager de la sienne, et tout intérêt à bâtir un terrain commun par le dialogue dans la société multiculturelle du Canada. C’est la mission de l’Institut interculturel Matin.

    Je serai heureux d’échanger avec toutes celles et ceux qui partagent cette vision.
  fa: |
    متین از یک جرقهٔ ناگهانی زاده نشد. حاصل سال‌ها کار است: نخست در برنامه‌ریزی فرهنگی در کشور زادگاهم، و سپس در شوراهای محلی و نهادهای برنامه‌ریزی فرهنگی در مونترال.

    این تجربه مرا به نتیجه‌ای روشن رساند. جای نهادی از گونه‌ای دیگر خالی بود: چابک، پاسخگو و دقیق، چیزی شبیه یک استارتاپ فرهنگی؛ کاملاً پایبند به قانون، اما رها از کلیشه‌هایی که بارها دست‌وپای این حوزه را بسته‌اند.

    این تجربه یک کمبود ساختاری را هم نشانم داد. در بسیاری از نهادها، تصمیم‌های فرهنگی در دست جمع کوچکی است. از مردم دعوت می‌شود که در برنامه‌ها شرکت کنند، اما کمتر از آن‌ها پرسیده می‌شود فرهنگ برایشان چه معنایی دارد، واقعاً به چه نیاز دارند، یا برنامه‌ها کجا می‌توانند به کارشان بیایند. در چند منطقهٔ شهرداری مونترال که در آن‌ها کار کرده‌ام، همان چهره‌های آشنا در هر برنامه دیده می‌شوند، در حالی که بخش بزرگی از مردم نمی‌دانند این برنامه‌ها و فضاهای محلی برای خود آن‌ها ساخته شده و با مالیات خودشان تأمین می‌شود.

    هرگز در پی ساختن یک شرکت فناوری یا کسب‌وکار صادرات و واردات نبودم. می‌خواستم همان مسیر حرفه‌ای را که سال‌ها پیموده بودم، در کانادا ادامه دهم. همان‌طور که بسیاری از مهاجران می‌دانند، بازیافتن جایگاه در رشتهٔ خود راهی دشوار است و برای آن از فرصت‌های اقتصادی دیگری گذشتم. امروز تعهد من این است که این دانش و تجربه را در خدمت جامعه بگذارم.

    این نام دو معنا دارد. در فارسی، «متین» یعنی کسی آرام، قابل اعتماد، مهربان و باتجربه. در فرانسوی، «matin» یعنی صبح: پایان شب و آغاز روزی تازه.

    آگاهانه ساختاری سبک را به جای سلسله‌مراتبی سنگین برگزیدیم. مؤسسه میان‌فرهنگی متین در اکتبر ۲۰۲۶ به‌عنوان یک سازمان غیرانتفاعی در کبک، کانادا، به ثبت رسید. از آن زمان نخستین گروه مشاوران خود را شکل داده‌ایم، مجموعهٔ «فرهنگ به زبان ساده» را با برنامهٔ ۱۰۰ نوشتهٔ کوتاه آموزشی در وبسایت آغاز کرده‌ایم، و نخستین پیاده‌روی گروهی‌مان را در پارک آنگرینیون ترتیب داده‌ایم.

    این شتاب به بهای از دست رفتن دقت نیست. ثبت مؤسسه تنها یک گام از برنامه‌ای بود که پیش از آن آغاز شده بود.

    هر جنسیت، پیشینه، خاستگاه یا زبانی که داشته باشیم، هر یک از ما چیزی برای آموختن از فرهنگ‌های دیگر دارد، چیزی ارزشمند برای به اشتراک گذاشتن از فرهنگ خود، و سهمی در ساختن زمینه‌ای مشترک از راه گفت‌وگو در جامعهٔ چندفرهنگی کانادا. این مأموریت مؤسسه میان‌فرهنگی متین است.

    خوشحال می‌شوم با همهٔ کسانی که این دیدگاه را دارند آشنا شوم.

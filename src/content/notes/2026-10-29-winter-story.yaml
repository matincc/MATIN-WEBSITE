# "Every Culture Has a Winter Story. What's Yours?", the President's LinkedIn post of
# Oct 29 2026, written in English (his exact text). French and Persian: translations.
date: 2026-10-29
original: en
headline:
  en: "Every Culture Has a Winter Story. What's Yours?"
  fr: "Chaque culture a son histoire d'hiver. Quelle est la vôtre ?"
  fa: "هر فرهنگی قصهٔ زمستان خودش را دارد. قصهٔ شما چیست؟"
text:
  en: |
    I have lived in Canada for a few years now. Every year, around this time, I see the same thing.

    The parks get empty. The streets get quiet. People go from home to car, from car to the mall, and back home again.

    In the mall, we walk. We look. We say a few words to a cashier. We see people, but we don't really meet them. There is no real conversation.

    In my years of cultural planning, I learned something simple: the weather is not only outside us. It shapes how we meet and how we talk. Some people call this geoculture. I just call it life.

    Many people in Canada live alone. We all remember COVID, when we could not talk to each other, and how hard that was. Winter can feel a little like that again.

    But every culture has its own answer to winter. In Iran, where I come from, we have Yalda night. On the longest night of the year, families sit together, eat pomegranates, read poetry, and talk until morning.

    So here is our idea at Matin Intercultural Institute. What if, every week, we open a space in the city and just talk? One topic, open conversation, people from different cultures sitting together. Nothing big. Just talking.

    Sometimes one good conversation is enough. You go home a little lighter. A little less alone. A little more hopeful.

    Small changes, simple ways. This is how we want to build a better community.

    How does your culture live through the dark months?
  fr: |
    Je vis au Canada depuis quelques années maintenant. Chaque année, à cette période, je vois la même chose.

    Les parcs se vident. Les rues deviennent silencieuses. Les gens vont de la maison à la voiture, de la voiture au centre commercial, puis rentrent à la maison.

    Au centre commercial, on marche. On regarde. On dit quelques mots à un caissier. On voit des gens, mais on ne les rencontre pas vraiment. Il n'y a pas de vraie conversation.

    Au fil de mes années en planification culturelle, j'ai appris une chose simple : le climat n'est pas seulement à l'extérieur de nous. Il façonne notre manière de nous rencontrer et de nous parler. Certains appellent cela la géoculture. Moi, j'appelle simplement cela la vie.

    Beaucoup de gens au Canada vivent seuls. Nous nous souvenons tous de la COVID, quand nous ne pouvions pas nous parler, et de ce que c'était difficile. L'hiver peut un peu y ressembler de nouveau.

    Mais chaque culture a sa propre réponse à l'hiver. En Iran, d'où je viens, nous avons la nuit de Yalda. Pendant la nuit la plus longue de l'année, les familles se réunissent, mangent des grenades, lisent de la poésie et parlent jusqu'au matin.

    Alors voici notre idée à l'Institut interculturel Matin. Et si, chaque semaine, nous ouvrions un espace dans la ville, simplement pour parler ? Un sujet, une conversation ouverte, des personnes de différentes cultures assises ensemble. Rien de grand. Simplement parler.

    Parfois, une bonne conversation suffit. On rentre chez soi un peu plus léger. Un peu moins seul. Un peu plus confiant en l'avenir.

    De petits changements, des moyens simples. C'est ainsi que nous voulons bâtir une communauté meilleure.

    Comment votre culture traverse-t-elle les mois sombres ?
  fa: |
    چند سالی است که در کانادا زندگی می‌کنم. هر سال، همین موقع، همان صحنه را می‌بینم.

    پارک‌ها خالی می‌شوند. خیابان‌ها ساکت می‌شوند. مردم از خانه به ماشین می‌روند، از ماشین به مرکز خرید، و دوباره به خانه برمی‌گردند.

    در مرکز خرید راه می‌رویم. نگاه می‌کنیم. چند کلمه‌ای با صندوقدار حرف می‌زنیم. آدم‌ها را می‌بینیم، اما واقعاً با آن‌ها دیدار نمی‌کنیم. گفت‌وگوی واقعی در کار نیست.

    در سال‌هایی که در برنامه‌ریزی فرهنگی کار کرده‌ام، چیز ساده‌ای آموختم: آب‌وهوا فقط بیرون از ما نیست. شکل دیدارها و گفت‌وگوهای ما را هم می‌سازد. بعضی‌ها به آن ژئوکالچر می‌گویند. من فقط اسمش را زندگی می‌گذارم.

    در کانادا بسیاری از مردم تنها زندگی می‌کنند. همهٔ ما دوران کرونا را به یاد داریم، وقتی نمی‌توانستیم با هم حرف بزنیم، و اینکه چقدر سخت بود. زمستان می‌تواند کمی دوباره همان حس را داشته باشد.

    اما هر فرهنگی پاسخ خودش را به زمستان دارد. در ایران، سرزمینی که از آن آمده‌ام، شب یلدا را داریم. در بلندترین شب سال، خانواده‌ها دور هم می‌نشینند، انار می‌خورند، شعر می‌خوانند و تا صبح با هم حرف می‌زنند.

    پس ایدهٔ ما در مؤسسه میان‌فرهنگی متین این است: اگر هر هفته فضایی در شهر باز کنیم و فقط با هم حرف بزنیم، چه می‌شود؟ یک موضوع، گفت‌وگوی آزاد، آدم‌هایی از فرهنگ‌های گوناگون که کنار هم می‌نشینند. چیز بزرگی نیست. فقط گفت‌وگو.

    گاهی یک گفت‌وگوی خوب کافی است. آدم کمی سبک‌تر به خانه برمی‌گردد. کمی کمتر تنها. کمی امیدوارتر.

    تغییرهای کوچک، راه‌های ساده. این‌گونه می‌خواهیم جامعه‌ای بهتر بسازیم.

    فرهنگ شما ماه‌های تاریک را چگونه از سر می‌گذراند؟

  fr: |
    Exemple de note. Ici paraîtra le texte d'une publication LinkedIn du président, mot pour mot, avec ses paragraphes.

    Une note longue est repliée après quelques lignes : on clique sur « Voir plus » pour la lire en entier, comme sur LinkedIn.

    La photo et la fonction du président et la date de publication s'affichent en haut, l'image de la publication sous le texte, et le bouton « Lire sur LinkedIn » mène à la publication d'origine.
  en: |
    Sample note. The text of one of the President's LinkedIn posts will appear here, word for word, with its paragraphs.

    A long note is folded after a few lines: readers click “See more” to read all of it, just like on LinkedIn.

    The President's photo and position and the publication date sit at the top, the post's picture under the text, and the “Read on LinkedIn” button opens the original post.
  fa: |
    یادداشت نمونه. متن یکی از پست‌های لینکدین رئیس مؤسسه، کلمه به کلمه و با همان بندها، در اینجا قرار می‌گیرد.

    یادداشت بلند پس از چند خط جمع می‌شود و خواننده با زدن «بیشتر» آن را کامل می‌خواند، درست مثل لینکدین.

    عکس و سمت رئیس مؤسسه و تاریخ انتشار در بالا، تصویر پست زیر متن، و دکمهٔ «خواندن در لینکدین» به پست اصلی می‌رود.

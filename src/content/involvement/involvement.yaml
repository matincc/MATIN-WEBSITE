# Volunteer introduction on Contact & Collaboration: the owner's text of Oct 27 2026
# (English and Persian as written by the owner; French translation by Claude).
volunteerIntro:
  fr: 'Où que vous soyez dans le monde, vous pouvez contribuer aux activités de Matin. Mettez vos compétences, votre expérience et vos idées au service de projets culturels, de recherche et de dialogue interculturel, et participez à des changements positifs.'
  en: 'Wherever you are in the world, you can be part of Matin. Contribute your skills, experience, and ideas to cultural, research, and intercultural projects, and help create positive change.'
  fa: 'هر کجای جهان که هستید، می‌توانید بخشی از متین باشید. با مهارت‌ها، تجربه‌ها و ایده‌های خود در پروژه‌های فرهنگی، پژوهشی و میان‌فرهنگی مشارکت کنید و در ایجاد تغییرات مثبت سهیم شوید.'
roles:
  - title: { fr: 'Accueil et événements', en: 'Welcome & events', fa: 'استقبال و رویدادها' }
    text:
      {
        fr: "Accueillir le public, aider à l'installation et à l'animation.",
        en: 'Welcome visitors and help with setup and hosting.',
        fa: 'خوشامدگویی به مهمانان و کمک به آماده‌سازی و میزبانی برنامه‌ها.',
      }
  - title: { fr: 'Communication', en: 'Communications', fa: 'ارتباطات' }
    text:
      {
        fr: 'Photo, rédaction, réseaux sociaux, traduction.',
        en: 'Photography, writing, social media, translation.',
        fa: 'عکاسی، نویسندگی، شبکه‌های اجتماعی، ترجمه.',
      }

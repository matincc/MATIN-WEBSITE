# Volunteer introduction on Contact & Collaboration: the owner's text of Oct 27 2026
# (English and Persian as written by the owner; French translation by Claude).
volunteerIntro:
  fr: 'Où que vous soyez dans le monde, mettez vos compétences, vos idées et votre passion au service de Matin. Contribuez à des projets porteurs de sens, collaborez au-delà des cultures et aidez-nous à faire la différence.'
  en: 'Wherever you are in the world, bring your skills, ideas, and passion to Matin. Contribute to meaningful projects, collaborate across cultures, and help us make a difference.'
  fa: 'در هر کجای جهان که هستید، مهارت‌ها، ایده‌ها و علاقه‌تان را با متین به اشتراک بگذارید. در پروژه‌های معنادار مشارکت کنید، در همکاری‌های میان‌فرهنگی سهیم شوید و به ایجاد تغییرات مثبت کمک کنید.'
roles:
  - title: { fr: 'Accueil et événements', en: 'Welcome & events', fa: 'استقبال و رویدادها' }
    text:
      {
        fr: "Accueillir le public, aider à l'installation et à l'animation.",
        en: 'Welcome visitors and help with setup and hosting.',
        fa: 'خوشامدگویی به مهمانان و کمک به آماده‌سازی و میزبانی برنامه‌ها.',
      }
  - title: { fr: 'Communication', en: 'Communications', fa: 'ارتباطات' }
    text:
      {
        fr: 'Photo, rédaction, réseaux sociaux, traduction.',
        en: 'Photography, writing, social media, translation.',
        fa: 'عکاسی، نویسندگی، شبکه‌های اجتماعی، ترجمه.',
      }

  fr: 'Dès le 28 octobre, la plus grande exposition de l’artiste, sa première au Québec, explore le chez-soi, la diaspora et les réseaux hérités du colonialisme.'
  en: 'From October 28, the artist’s largest exhibition to date, and her first in Québec, explores home, diaspora and the networks shaped by colonialism.'
  fa: 'از ۲۸ اکتبر، بزرگ‌ترین نمایشگاه این هنرمند و نخستین نمایشگاه او در کبک، به خانه، دیاسپورا و شبکه‌های برآمده از استعمار می‌پردازد.'
body:
  fr: |
    PHI présente ANTHEMS, la plus grande exposition à ce jour de l’artiste Stephanie Comilang et sa première au Québec, du 28 octobre 2026 au 14 mars 2027. Vidéo, réalité virtuelle, textile et objets imprimés en 3D y mêlent documentaire et fiction.

    L’exposition est présentée au 451, rue Saint-Jean, dans le Vieux-Montréal.
  en: |
    PHI presents ANTHEMS, the largest exhibition to date by artist Stephanie Comilang and her first in Québec, from October 28, 2026 to March 14, 2027. Video, virtual reality, textiles and 3D-printed objects blend documentary and fiction.

    The exhibition is at 451 Saint-Jean Street, in Old Montréal.
  fa: |
    PHI نمایشگاه ANTHEMS را از ۲۸ اکتبر ۲۰۲۶ تا ۱۴ مارس ۲۰۲۷ برگزار می‌کند؛ بزرگ‌ترین نمایشگاه استفانی کومیلانگ تا امروز و نخستین نمایشگاه او در کبک. ویدیو، واقعیت مجازی، منسوجات و اشیای چاپ سه‌بعدی، مستند و داستان را در هم می‌آمیزند.

    نشانی: ۴۵۱ خیابان سن‌ژان، مونترال قدیم.

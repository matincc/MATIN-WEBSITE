body:
  fr: |
    Le 25 août 2026, en vue des élections provinciales, Culture Montréal a dévoilé sa plateforme « La culture fait campagne », qui réunit 37 propositions sur la place de la culture dans le développement du Québec. L’organisme demande notamment au prochain gouvernement d’actualiser la politique culturelle de 2018 et de porter le budget de la culture à 3 % du budget du Québec d’ici quatre ans, avec une indexation annuelle.
  en: |
    On August 25, 2026, ahead of the provincial election, Culture Montréal released its platform “La culture fait campagne”, which brings together 37 proposals on the place of culture in Québec’s development. Among other things, the organization asks the next government to update the 2018 cultural policy and to raise culture to 3% of Québec’s budget within four years, with yearly indexation.
  fa: |
    کولتور مونترال در ۲۵ اوت ۲۰۲۶، پیش از انتخابات استانی، برنامهٔ «فرهنگ در کارزار» را با ۳۷ پیشنهاد دربارهٔ جایگاه فرهنگ در توسعهٔ کبک منتشر کرد. این نهاد از جمله از دولت آینده خواسته است سیاست فرهنگی ۲۰۱۸ را به‌روز کند و سهم فرهنگ را در چهار سال به ۳ درصد بودجهٔ کبک برساند، با افزایش سالانه متناسب با تورم.

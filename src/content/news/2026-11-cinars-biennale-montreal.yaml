title:
  fr: 'La Biennale CINARS réunit les arts de la scène du monde à Montréal'
  en: 'CINARS Biennale brings the world’s performing arts to Montréal'
  fa: 'بینال سینارس، هنرهای نمایشی جهان را در مونترال گرد هم می‌آورد'

  fa: 'از ۹ تا ۱۴ نوامبر، بیش از ۱۲۰ اجرا و دیدارهای حرفه‌ای، هنرمندان، گروه‌ها و برگزارکنندگانی از چند قاره را گرد هم می‌آورد.'
body:
  fr: |
    La Biennale CINARS, grand rendez-vous international des arts de la scène, a lieu à Montréal du 9 au 14 novembre 2026. Plus de 120 spectacles y sont présentés, avec des rencontres entre compagnies, agents et diffuseurs. L’édition 2024 avait accueilli des participants de 47 pays.

    Programme et inscription sur le site de CINARS.
  en: |
    The CINARS Biennale, a major international gathering for the performing arts, takes place in Montréal from November 9 to 14, 2026. More than 120 performances are presented, with meetings between companies, agents and presenters. The 2024 edition welcomed participants from 47 countries.

    Program and registration are on the CINARS website.
  fa: |
    بینال سینارس، از مهم‌ترین گردهمایی‌های بین‌المللی هنرهای نمایشی، از ۹ تا ۱۴ نوامبر ۲۰۲۶ در مونترال برگزار می‌شود. بیش از ۱۲۰ اجرا همراه با دیدار گروه‌ها، نمایندگان و برگزارکنندگان در برنامه است. دوره ۲۰۲۴ میزبان شرکت‌کنندگانی از ۴۷ کشور بود.

    برنامه و ثبت‌نام در وب‌سایت سینارس.

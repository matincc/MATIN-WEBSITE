title:
  fr: 'La Haye accueille le 5e Forum mondial de l’UNESCO contre le racisme et les discriminations'
  en: 'The Hague hosts UNESCO’s 5th Global Forum against Racism and Discrimination'
  fa: 'لاهه میزبان پنجمین مجمع جهانی یونسکو علیه نژادپرستی و تبعیض'
excerpt:
  fr: 'Les 29 et 30 octobre, gouvernements, organisations internationales, société civile et chercheurs se réunissent au World Forum de La Haye pour passer des engagements aux résultats.'
  en: 'On October 29 and 30, governments, international organizations, civil society and researchers meet at the World Forum in The Hague to turn commitments into results.'
  fa: '۲۹ و ۳۰ اکتبر، دولت‌ها، سازمان‌های بین‌المللی، جامعه مدنی و پژوهشگران در ورلد فوروم لاهه گرد هم می‌آیند تا تعهدها را به نتیجه برسانند.'
body:
  fr: |
    Le 5e Forum mondial de l’UNESCO contre le racisme et les discriminations se tient au World Forum de La Haye, aux Pays-Bas, en partenariat avec le Royaume des Pays-Bas. Son thème : « De l’engagement à la responsabilité : changer le système, changer l’avenir ».

    Lancé à Paris en 2021, le forum s’est ensuite tenu à Mexico, São Paulo et Barcelone. Cette édition porte notamment sur les politiques inclusives, les inégalités systémiques, la transformation numérique et la justice réparatrice.
  en: |
    UNESCO’s 5th Global Forum against Racism and Discrimination takes place at the World Forum in The Hague, the Netherlands, in partnership with the Kingdom of the Netherlands. Its theme: “From commitment to accountability: change the system, change the future.”

    First held in Paris in 2021, the forum has since met in Mexico City, São Paulo and Barcelona. This edition looks at inclusive policymaking, systemic inequalities, digital transformation and reparatory justice.
  fa: |
    پنجمین مجمع جهانی یونسکو علیه نژادپرستی و تبعیض با همکاری پادشاهی هلند در ورلد فوروم لاهه برگزار می‌شود. موضوع این دوره: «از تعهد تا پاسخ‌گویی: نظام را تغییر دهیم، آینده را تغییر دهیم».

    این مجمع نخستین بار در سال ۲۰۲۱ در پاریس برگزار شد و پس از آن در مکزیکوسیتی، سائوپائولو و بارسلونا. این دوره به سیاست‌گذاری فراگیر، نابرابری‌های ساختاری، تحول دیجیتال و عدالت جبرانی می‌پردازد.

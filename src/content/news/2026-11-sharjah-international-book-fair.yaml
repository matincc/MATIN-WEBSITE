title:
  fr: 'La Foire internationale du livre de Sharjah ouvre sa 45e édition'
  en: 'Sharjah International Book Fair opens its 45th edition'
  fa: 'چهل‌وپنجمین نمایشگاه بین‌المللی کتاب شارجه آغاز می‌شود'
excerpt:
  fr: 'Du 4 au 15 novembre, aux Émirats arabes unis, l’une des plus grandes foires du livre au monde, avec le sultanat d’Oman comme invité d’honneur.'
  en: 'From November 4 to 15, in the United Arab Emirates, one of the world’s largest book fairs, with the Sultanate of Oman as guest of honour.'
  fa: 'از ۴ تا ۱۵ نوامبر در امارات متحده عربی، یکی از بزرگ‌ترین نمایشگاه‌های کتاب جهان، با عمان به‌عنوان مهمان ویژه.'
body:
  fr: |
    La 45e Foire internationale du livre de Sharjah a lieu du 4 au 15 novembre 2026 à l’Expo Centre de Sharjah, sous le thème « Made of Stories ». Le sultanat d’Oman, invité d’honneur, y présente son patrimoine littéraire, artistique et culturel. La foire accueille aussi des rencontres professionnelles sur l’édition, la traduction et les bibliothèques.

    Programme sur le site de la foire.
  en: |
    The 45th Sharjah International Book Fair takes place from November 4 to 15, 2026, at Expo Centre Sharjah, under the theme “Made of Stories”. The Sultanate of Oman, guest of honour, presents its literary, artistic and cultural heritage. The fair also hosts professional meetings on publishing, translation and libraries.

    Program on the fair’s website.
  fa: |
    چهل‌وپنجمین نمایشگاه بین‌المللی کتاب شارجه از ۴ تا ۱۵ نوامبر ۲۰۲۶ در مرکز نمایشگاهی شارجه با شعار «Made of Stories» (ساخته از داستان‌ها) برگزار می‌شود. عمان، مهمان ویژه این دوره، میراث ادبی، هنری و فرهنگی خود را معرفی می‌کند. نشست‌های حرفه‌ای درباره نشر، ترجمه و کتابخانه‌ها نیز در برنامه است.

    برنامه در وب‌سایت نمایشگاه.

body:
  fr: |
    Le 26 octobre 2026, le ministre de la Culture du Québec, Pascal Bérubé, a présenté ses priorités. Il veut d’abord rendre la culture québécoise plus visible auprès des jeunes. Parmi les mesures annoncées : des dimanches gratuits dans les musées, des billets jumelés pour les jeunes et 200 M$ pour le Conseil des arts et des lettres du Québec (CALQ).
  en: |
    On October 26, 2026, Québec’s Minister of Culture, Pascal Bérubé, set out his priorities. His first aim is to make Québec culture more visible to young people. Announced measures include free museum Sundays, paired tickets for young people and $200M for the Conseil des arts et des lettres du Québec (CALQ).
  fa: |
    پاسکال بروبه، وزیر فرهنگ کبک، در ۲۶ اکتبر ۲۰۲۶ اولویت‌های خود را بیان کرد. هدف نخست او دیده‌شدن بیشتر فرهنگ کبک نزد جوانان است. از جمله اقدام‌های اعلام‌شده: یکشنبه‌های رایگان در موزه‌ها، بلیت دونفره برای جوانان و ۲۰۰ میلیون دلار برای شورای هنر و ادبیات کبک (CALQ).

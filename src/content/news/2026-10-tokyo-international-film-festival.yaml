body:
  fr: |
    Le Festival international du film de Tokyo, le plus important festival de cinéma du Japon, tient sa 39e édition du 26 octobre au 4 novembre 2026. Il s’ouvre avec Sukiyaki de Zeze Takahisa et se termine avec Colony de Yeon Sang-ho.

    Quinze films sont en compétition pour le Grand Prix de Tokyo, dont sept en première mondiale. Le programme compte aussi des galas, des films d’animation et une rétrospective de 12 films de Kenji Mizoguchi.
  en: |
    The Tokyo International Film Festival, Japan’s largest film festival, holds its 39th edition from October 26 to November 4, 2026. It opens with Zeze Takahisa’s Sukiyaki and closes with Yeon Sang-ho’s Colony.

    Fifteen films compete for the Tokyo Grand Prix, seven of them world premieres. The program also includes gala screenings, animation and a 12-film Kenji Mizoguchi retrospective.
  fa: |
    جشنواره بین‌المللی فیلم توکیو، بزرگ‌ترین جشنواره سینمایی ژاپن، سی‌ونهمین دوره خود را از ۲۶ اکتبر تا ۴ نوامبر ۲۰۲۶ برگزار می‌کند. افتتاحیه با فیلم «سوکیاکی» ساخته زِزه تاکاهیسا و اختتامیه با «کلونی» ساخته یون سانگ-هو است.

    پانزده فیلم، از جمله هفت نمایش جهانی نخست، برای جایزه بزرگ توکیو رقابت می‌کنند. برنامه شامل نمایش‌های ویژه، انیمیشن و مروری بر ۱۲ فیلم از کنجی میزوگوچی نیز هست.

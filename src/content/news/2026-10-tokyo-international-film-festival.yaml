title:
  fr: 'Le 39e Festival international du film de Tokyo est lancé'
  en: 'The 39th Tokyo International Film Festival is under way'
  fa: 'سی‌ونهمین جشنواره بین‌المللی فیلم توکیو آغاز شد'

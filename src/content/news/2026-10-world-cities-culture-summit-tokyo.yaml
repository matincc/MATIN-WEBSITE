  fr: 'Du 28 au 30 octobre, les responsables culturels de plus de 45 grandes villes échangent sur la culture face au climat, aux inégalités et à l’intelligence artificielle.'
  en: 'From October 28 to 30, cultural leaders from more than 45 major cities discuss culture’s role in the face of climate change, inequality and artificial intelligence.'
  fa: 'از ۲۸ تا ۳۰ اکتبر، مسئولان فرهنگی بیش از ۴۵ شهر بزرگ جهان درباره نقش فرهنگ در برابر بحران اقلیم، نابرابری و هوش مصنوعی گفت‌وگو می‌کنند.'
body:
  fr: |
    Le 15e Sommet culturel des villes du monde (World Cities Culture Summit) se tient à Tokyo du 28 au 30 octobre 2026. Il réunit le réseau du World Cities Culture Forum, plus de 45 villes, autour des politiques culturelles urbaines : crise climatique, inégalités sociales et intelligence artificielle générative.

    Détails sur le site du World Cities Culture Forum.
  en: |
    The 15th World Cities Culture Summit takes place in Tokyo from October 28 to 30, 2026. It brings together the World Cities Culture Forum network of more than 45 cities around urban cultural policy: the climate crisis, social inequality and generative artificial intelligence.

    Details are on the World Cities Culture Forum website.
  fa: |
    پانزدهمین اجلاس فرهنگ شهرهای جهان (World Cities Culture Summit) از ۲۸ تا ۳۰ اکتبر ۲۰۲۶ در توکیو برگزار می‌شود. این اجلاس شبکه «انجمن فرهنگ شهرهای جهان» با بیش از ۴۵ شهر را پیرامون سیاست‌گذاری فرهنگی شهری گرد هم می‌آورد: بحران اقلیم، نابرابری اجتماعی و هوش مصنوعی مولد.

    جزئیات در وب‌سایت انجمن فرهنگ شهرهای جهان.

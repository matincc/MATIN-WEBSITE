title:
  fr: 'Art Toronto réunit plus de 100 galeries'
  en: 'Art Toronto brings together more than 100 galleries'
  fa: 'آرت تورنتو با بیش از ۱۰۰ گالری'
excerpt:
  fr: 'Du 29 octobre au 1er novembre, la foire d’art du Canada réunit galeries, installations et espaces de projets d’ici et d’ailleurs à Toronto.'
  en: 'From October 29 to November 1, Canada’s art fair gathers galleries, installations and project spaces from Canada and abroad in Toronto.'
  fa: 'از ۲۹ اکتبر تا ۱ نوامبر، نمایشگاه هنری کانادا گالری‌ها، چیدمان‌ها و فضاهای هنری از کانادا و جهان را در تورنتو گرد هم می‌آورد.'
body:
  fr: |
    Art Toronto, la foire d’art du Canada, a lieu du 29 octobre au 1er novembre 2026 au Palais des congrès du Toronto métropolitain (édifice Nord). Plus de 100 galeries, installations et espaces de projets canadiens et internationaux y participent.

    Détails et billets sur le site d’Art Toronto.
  en: |
    Art Toronto, Canada’s art fair, takes place from October 29 to November 1, 2026, at the Metro Toronto Convention Centre (North Building). More than 100 galleries, installations and project spaces from Canada and abroad take part.

    Details and tickets are on the Art Toronto website.
  fa: |
    آرت تورنتو، نمایشگاه هنری کانادا، از ۲۹ اکتبر تا ۱ نوامبر ۲۰۲۶ در مرکز همایش‌های تورنتو (ساختمان شمالی) برگزار می‌شود و بیش از ۱۰۰ گالری، چیدمان و فضای هنری کانادایی و بین‌المللی در آن حضور دارند.

    جزئیات و بلیت در وب‌سایت آرت تورنتو.

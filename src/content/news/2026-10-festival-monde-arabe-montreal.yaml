title:
  fr: 'Le Festival du Monde Arabe de Montréal ouvre sa 27e édition'
  en: 'Arab World Festival of Montréal opens its 27th edition'
  fa: 'بیست‌وهفتمین جشنواره جهان عرب مونترال آغاز می‌شود'
excerpt:
  fr: 'Dès le 30 octobre, concerts, films, danse, conférences et débats font dialoguer les cultures arabes et occidentales, notamment à la Place des Arts, jusqu’à la mi-novembre.'
  en: 'From October 30, concerts, films, dance, talks and debates bring Arab and Western cultures into dialogue, including at Place des Arts, until mid-November.'
  fa: 'از ۳۰ اکتبر تا اواسط نوامبر، کنسرت، فیلم، رقص، سخنرانی و گفت‌وگو، فرهنگ‌های عربی و غربی را در کنار هم قرار می‌دهد؛ از جمله در پلاس دزار.'
body:
  fr: |
    La 27e édition du Festival du Monde Arabe de Montréal commence le 30 octobre 2026. Ce festival pluridisciplinaire réunit artistes, cinéastes et intellectuels de nombreux horizons autour du dialogue entre les cultures arabes et occidentales.

    Le programme complet et les billets sont sur le site du festival.
  en: |
    The 27th Arab World Festival of Montréal begins on October 30, 2026. This multidisciplinary festival brings together artists, filmmakers and thinkers from many backgrounds around the dialogue between Arab and Western cultures.

    The full program and tickets are on the festival's website.
  fa: |
    بیست‌وهفتمین دوره جشنواره جهان عرب مونترال از ۳۰ اکتبر ۲۰۲۶ آغاز می‌شود. این جشنواره چندرشته‌ای، هنرمندان، فیلم‌سازان و اندیشمندانی از پیشینه‌های گوناگون را پیرامون گفت‌وگوی فرهنگ‌های عربی و غربی گرد هم می‌آورد.

    برنامه کامل و بلیت‌ها در وب‌سایت جشنواره در دسترس است.

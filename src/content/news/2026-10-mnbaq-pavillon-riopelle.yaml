title:
  fr: 'Le MNBAQ ouvre l’Espace Riopelle à Québec'
  en: 'Québec City’s MNBAQ opens its Riopelle pavilion'
  fa: 'موزه ملی هنرهای زیبای کبک پاویون ریوپل را افتتاح کرد'
excerpt:
  fr: 'Un pavillon de 84 M$ consacré à Jean Paul Riopelle ouvre le 22 octobre au Musée national des beaux-arts du Québec.'
  en: 'An $84-million pavilion devoted to Jean Paul Riopelle opens on October 22 at the Musée national des beaux-arts du Québec.'
  fa: 'پاویونی ۸۴ میلیون دلاری ویژه ژان پل ریوپل از ۲۲ اکتبر در موزه ملی هنرهای زیبای کبک گشوده شد.'
body:
  fr: |
    Conçu par FABG Architectes, l’Espace Riopelle-Michael Audain compte trois étages et quatre salles d’exposition, dont une galerie circulaire pour le triptyque L’Hommage à Rosa Luxemburg, long de 40 mètres. Le gouvernement du Québec y a contribué plus de 40 M$.
  en: |
    Designed by FABG Architectes, the three-storey Espace Riopelle-Michael Audain Pavilion has four exhibition spaces, including a circular gallery for the 40-metre triptych L’Hommage à Rosa Luxemburg. The Québec government contributed over $40 million.
  fa: |
    این پاویون سه‌طبقه که FABG Architectes طراحی کرده، چهار فضای نمایشگاهی دارد؛ از جمله گالری دایره‌ای برای سه‌لتی ۴۰ متری «ادای احترام به رزا لوکزامبورگ». دولت کبک بیش از ۴۰ میلیون دلار در آن سهم داشته است.

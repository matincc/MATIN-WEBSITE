title:
  fr: 'Le Toronto International Festival of Authors tient sa 47e édition'
  en: 'Toronto International Festival of Authors returns for its 47th edition'
  fa: 'چهل‌وهفتمین جشنواره بین‌المللی نویسندگان تورنتو'
excerpt:
  fr: 'Du 27 octobre au 1er novembre, lectures et rencontres avec des auteurs canadiens et internationaux à l’Université Victoria, Université de Toronto.'
  en: 'From October 27 to November 1, readings and conversations with writers from Canada and around the world at Victoria University, University of Toronto.'
  fa: 'از ۲۷ اکتبر تا ۱ نوامبر، کتاب‌خوانی و گفت‌وگو با نویسندگان کانادایی و بین‌المللی در دانشگاه ویکتوریا، دانشگاه تورنتو.'
body:
  fr: |
    Le Toronto International Festival of Authors, l’un des plus anciens festivals littéraires du Canada, présente sa 47e édition du 27 octobre au 1er novembre 2026 à l’Université Victoria (Université de Toronto).

    Programme et billets sur le site du festival.
  en: |
    The Toronto International Festival of Authors, one of Canada’s longest-running literary festivals, holds its 47th edition from October 27 to November 1, 2026, at Victoria University in the University of Toronto.

    Program and tickets are on the festival’s website.
  fa: |
    جشنواره بین‌المللی نویسندگان تورنتو، یکی از قدیمی‌ترین جشنواره‌های ادبی کانادا، چهل‌وهفتمین دوره خود را از ۲۷ اکتبر تا ۱ نوامبر ۲۰۲۶ در دانشگاه ویکتوریا (دانشگاه تورنتو) برگزار می‌کند.

    برنامه و بلیت در وب‌سایت جشنواره.

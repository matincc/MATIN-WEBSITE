title:
  fr: 'Ottawa double son engagement envers la Collection McMichael d’art canadien'
  en: 'Ottawa doubles its commitment to the McMichael Canadian Art Collection'
  fa: 'دو برابر شدن حمایت دولت فدرال از مجموعهٔ هنر کانادایی مک‌مایکل'
excerpt:
  fr: '25 M$ de plus, 50 M$ fédéraux au total avec 50 M$ de l’Ontario ; réouverture prévue en 2029.'
  en: 'A further $25M, $50M federal in total alongside $50M from Ontario; reopening planned for 2029.'
  fa: '۲۵ میلیون دلار بیشتر، در مجموع ۵۰ میلیون فدرال و ۵۰ میلیون از انتاریو؛ بازگشایی در ۲۰۲۹.'
body:
  fr: |
    Le 29 octobre 2026, le gouvernement du Canada a annoncé 25 M$ de plus pour la rénovation de la Collection McMichael d’art canadien, en Ontario, ce qui porte sa contribution à 50 M$. L’Ontario y consacre aussi 50 M$. La réouverture est prévue en 2029.
  en: |
    On October 29, 2026, the Government of Canada announced a further $25M for the renewal of the McMichael Canadian Art Collection in Ontario, bringing its contribution to $50M. Ontario is also investing $50M. Reopening is planned for 2029.
  fa: |
    دولت کانادا در ۲۹ اکتبر ۲۰۲۶ برای نوسازی مجموعهٔ هنر کانادایی مک‌مایکل در انتاریو ۲۵ میلیون دلار دیگر اعلام کرد و سهم خود را به ۵۰ میلیون دلار رساند. انتاریو نیز ۵۰ میلیون دلار می‌پردازد. بازگشایی برای ۲۰۲۹ پیش‌بینی شده است.

body:
  fr: |
    Le 27 octobre 2026, le Conseil des arts et des lettres du Québec (CALQ) a dévoilé son Plan d’action international 2026-2031 : trois orientations, huit actions et plus de 60 M$ sur cinq ans. Le plan prévoit notamment un partenariat d’exportation avec le Port de Montréal, un projet pilote avec la Chambre de commerce du Canada et une résidence de huit semaines au Sénégal.
  en: |
    On October 27, 2026, the Conseil des arts et des lettres du Québec (CALQ) unveiled its 2026-2031 International Action Plan: three directions, eight actions and over $60M over five years. It includes an export partnership with the Port of Montréal, a pilot project with the Canadian Chamber of Commerce and an eight-week residency in Senegal.
  fa: |
    شورای هنر و ادبیات کبک (CALQ) در ۲۷ اکتبر ۲۰۲۶ برنامهٔ اقدام بین‌المللی ۲۰۲۶ تا ۲۰۳۱ خود را معرفی کرد: سه محور، هشت اقدام و بیش از ۶۰ میلیون دلار در پنج سال. این برنامه از جمله همکاری صادراتی با بندر مونترال، طرحی آزمایشی با اتاق بازرگانی کانادا و یک اقامت هنری هشت‌هفته‌ای در سنگال را در بر دارد.

body:
  fr: |
    Le 27 octobre 2026, le gouvernement du Québec a dévoilé les lauréats des Prix du Québec 2026, sa plus haute distinction en culture et en science. Dans le volet culturel, neuf personnes sont honorées, parmi lesquelles le cinéaste Bernard Émond, l’écrivain Dany Laferrière, le chorégraphe Sylvain Émard, l’architecte et designer Marie-Josée Lacroix et l’historienne Joanne Burgess pour le patrimoine.
  en: |
    On October 27, 2026, the Québec government announced the laureates of the 2026 Prix du Québec, its highest honour in culture and science. In culture, nine people are recognized, among them filmmaker Bernard Émond, writer Dany Laferrière, choreographer Sylvain Émard, architect and designer Marie-Josée Lacroix and historian Joanne Burgess for heritage.
  fa: |
    دولت کبک در ۲۷ اکتبر ۲۰۲۶ برندگان «جوایز کبک ۲۰۲۶» را معرفی کرد؛ بالاترین نشان افتخار این استان در فرهنگ و علم. در بخش فرهنگ، نه نفر برگزیده شده‌اند، از جمله برنار امون، فیلم‌ساز؛ دنی لافریر، نویسنده؛ سیلون امار، طراح رقص؛ ماری‌ژوزه لاکروا، معمار و طراح؛ و ژوان برجس، تاریخ‌نگار، در زمینهٔ میراث فرهنگی.

title:
  fr: 'Patrimoine subaquatique : l’UNESCO présente la Déclaration d’Alexandrie'
  en: 'Underwater heritage: UNESCO presents the Alexandria Declaration'
  fa: 'میراث زیر آب: یونسکو «اعلامیهٔ اسکندریه» را معرفی کرد'
excerpt:
  fr: 'Vingt-cinq ans après sa Convention de 2001, l’UNESCO fixe les priorités des prochaines décennies pour le patrimoine sous les mers.'
  en: 'Twenty-five years after its 2001 Convention, UNESCO sets the priorities for the coming decades for heritage beneath the sea.'
  fa: 'یونسکو ۲۵ سال پس از کنوانسیون ۲۰۰۱، اولویت‌های دهه‌های آینده را برای میراث فرهنگی زیر دریا تعیین کرد.'
body:
  fr: |
    Le 28 octobre 2026, l’UNESCO a présenté la Déclaration d’Alexandrie, adoptée en Égypte pour les 25 ans de la Convention de 2001 sur la protection du patrimoine culturel subaquatique. Le texte garde la protection des épaves et des sites engloutis au centre, tout en appelant à mieux reconnaître la valeur de ce patrimoine pour la recherche, le développement durable et la résilience des communautés côtières.
  en: |
    On October 28, 2026, UNESCO presented the Alexandria Declaration, adopted in Egypt for the 25th anniversary of the 2001 Convention on the Protection of the Underwater Cultural Heritage. The text keeps the protection of wrecks and submerged sites at its heart, while calling for wider recognition of this heritage's value for research, sustainable development and the resilience of coastal communities.
  fa: |
    یونسکو در ۲۸ اکتبر ۲۰۲۶ «اعلامیهٔ اسکندریه» را معرفی کرد؛ اعلامیه‌ای که در مصر و به مناسبت ۲۵ سالگی کنوانسیون ۲۰۰۱ حفاظت از میراث فرهنگی زیر آب تصویب شد. این متن حفاظت از کشتی‌های غرق‌شده و محوطه‌های زیر آب را در مرکز نگه می‌دارد و خواستار شناخت بیشتر ارزش این میراث برای پژوهش، توسعهٔ پایدار و تاب‌آوری جوامع ساحلی است.

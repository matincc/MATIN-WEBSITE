title:
  fr: 'L’UNESCO choisit 50 jeunes leaders du dialogue interculturel'
  en: 'UNESCO selects 50 young leaders in intercultural dialogue'
  fa: 'یونسکو ۵۰ رهبر جوان گفت‌وگوی میان‌فرهنگی را برگزید'
excerpt:
  fr: 'Venus de 38 pays, ils rejoignent la deuxième cohorte du programme Youth for Peace, consacré au dialogue interculturel à l’ère de l’IA.'
  en: 'From 38 countries, they join the second cohort of the Youth for Peace programme on intercultural dialogue in the age of AI.'
  fa: 'آن‌ها از ۳۸ کشور به دورهٔ دوم برنامهٔ «جوانان برای صلح» یونسکو دربارهٔ گفت‌وگوی میان‌فرهنگی در عصر هوش مصنوعی پیوستند.'
body:
  fr: |
    Le 21 octobre 2026, l’UNESCO a annoncé la sélection de 50 jeunes leaders de 25 à 45 ans, venus de 38 pays, pour la deuxième cohorte de son programme Youth for Peace. Choisis parmi 6 786 candidatures, ils recevront formation et mentorat pour mener, par le dialogue interculturel, des projets qui répondent aux défis de leurs communautés à l’ère de l’intelligence artificielle.
  en: |
    On October 21, 2026, UNESCO announced the selection of 50 young leaders aged 25 to 45, from 38 countries, for the second cohort of its Youth for Peace programme. Chosen from 6,786 applicants, they will receive training and mentoring to lead projects that use intercultural dialogue to address their communities’ challenges in the age of artificial intelligence.
  fa: |
    یونسکو در ۲۱ اکتبر ۲۰۲۶ اعلام کرد ۵۰ رهبر جوان ۲۵ تا ۴۵ ساله از ۳۸ کشور را برای دورهٔ دوم برنامهٔ «جوانان برای صلح» برگزیده است. این افراد از میان ۶۷۸۶ متقاضی انتخاب شده‌اند و آموزش و راهنمایی می‌گیرند تا با گفت‌وگوی میان‌فرهنگی، طرح‌هایی برای چالش‌های جوامع خود در عصر هوش مصنوعی پیش ببرند.

title:
  fr: 'Le Musée du Montréal juif rouvrira son bâtiment du boulevard Saint-Laurent'
  en: 'The Museum of Jewish Montreal will reopen its Saint-Laurent Boulevard building'
  fa: 'موزه یهودیان مونترال ساختمان خود را در بلوار سن‌لوران بازگشایی می‌کند'
excerpt:
  fr: 'Ottawa investit plus de 3,2 M$ pour transformer le bâtiment, fermé au public depuis près de 30 ans, en lieu communautaire.'
  en: 'Ottawa is investing over $3.2 million to turn the building, closed to visitors for nearly 30 years, into a community space.'
  fa: 'دولت فدرال بیش از ۳.۲ میلیون دلار برای تبدیل این ساختمان، که نزدیک ۳۰ سال به روی بازدیدکنندگان بسته بوده، به فضایی اجتماعی سرمایه‌گذاری می‌کند.'
body:
  fr: |
    Le gouvernement fédéral verse 3 234 476 $ au projet par le Programme des bâtiments communautaires verts et inclusifs; le musée et d’autres partenaires ajoutent 1 625 000 $. Le bâtiment du 5220, boulevard Saint-Laurent accueillera une salle d’événements, une galerie d’exposition, un café et des ateliers de création.
  en: |
    The federal government is contributing $3,234,476 through the Green and Inclusive Community Buildings program, with the museum and other funders adding $1,625,000. The building at 5220 Saint-Laurent Boulevard will house an event space, an exhibition gallery, a café and creative workshop rooms.
  fa: |
    دولت فدرال از طریق برنامه ساختمان‌های اجتماعی سبز و فراگیر ۳٬۲۳۴٬۴۷۶ دلار می‌پردازد و موزه و دیگر حامیان ۱٬۶۲۵٬۰۰۰ دلار دیگر اضافه می‌کنند. ساختمان شماره ۵۲۲۰ بلوار سن‌لوران فضای رویداد، گالری، کافه و اتاق‌های کارگاه خلاقیت خواهد داشت.

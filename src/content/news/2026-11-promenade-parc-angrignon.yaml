      en: 'Interview 1 · Came to Montréal for love'
      fa: 'مصاحبه ۱ · ساکن مونترال به خاطر عشق'
    text:
      fr: '« Je suis tombée en amour […] de la ville […] parce que c’est une ville multiculturelle. Il y a des événements tout le temps, toutes les saisons. »'
      en: '“I fell in love […] with the city […] because it’s a multicultural city. There are events all the time, every season.” (translated from French)'
      fa: '«عاشق […] این شهر شدم […] چون شهری چندفرهنگی است. همیشه و در همه فصل‌ها رویدادی برپاست.» (ترجمه از فرانسه)'
  - image: ../../assets/uploads/news/walk-2026-11-07/interview-2.jpg
    focus: '50% 40%'
    label:
      fr: 'Entrevue 2 · À Montréal depuis 8 ans'
      en: 'Interview 2 · In Montréal for 8 years'
      fa: 'مصاحبه ۲ · هشت سال در مونترال'
    text:
      fr: '« Il y a beaucoup de cultures […] on vit tous ensemble […] on s’unit ensemble pour créer quelque chose [d’]extraordinaire. »'
      en: '“There are many cultures here […] we all live together […] we come together to create something extraordinary.” (translated from French)'
      fa: '«اینجا فرهنگ‌های بسیاری هست […] همه با هم زندگی می‌کنیم […] دست به دست هم می‌دهیم تا چیزی فوق‌العاده بسازیم.» (ترجمه از فرانسه)'
  - image: ../../assets/uploads/news/walk-2026-11-07/interview-3.jpg
    focus: '50% 45%'
    label:
      fr: 'Entrevue 3 · À Montréal depuis près de 17 ans'
      en: 'Interview 3 · In Montréal for almost 17 years'
      fa: 'مصاحبه ۳ · نزدیک به ۱۷ سال در مونترال'
    text:
      fr: '« Ça vous donne vraiment la possibilité de vous exprimer […] et de façonner votre avenir dans un nouveau pays. » (entrevue en anglais, traduite)'
      en: '“It gives you really the ability to express yourself […] the way you want your future to shape in a new country.”'
      fa: '«واقعاً این امکان را به شما می‌دهد که خودتان را بیان کنید […] و آینده‌تان را در کشوری تازه آن‌طور که می‌خواهید بسازید.» (ترجمه از انگلیسی)'

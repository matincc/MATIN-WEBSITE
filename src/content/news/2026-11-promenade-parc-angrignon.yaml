body:
  fr: |
    **7 novembre 2026 · Parc Angrignon, LaSalle**

    Le samedi 7 novembre 2026, l’**Institut interculturel Matin** a tenu sa toute première activité publique : une promenade et des échanges interculturels au parc Angrignon, inscrite au calendrier officiel de la Semaine québécoise des rencontres interculturelles. 21 personnes ont marché ensemble et échangé en français, malgré le vent froid de novembre. Trois participant·e·s ont livré leur témoignage devant la caméra.
  en: |
    **November 7, 2026 · Parc Angrignon, LaSalle**

    On Saturday, November 7, 2026, **Matin Intercultural Institute** held its very first public activity: an intercultural walk and conversations in Parc Angrignon, listed on the official calendar of Québec’s Intercultural Encounters Week. 21 people walked together and talked in French, despite the cold November wind. Three participants shared their testimony on camera.
  fa: |
    **۷ نوامبر ۲۰۲۶ · پارک آنگرینیون، لاسال**

    شنبه ۷ نوامبر ۲۰۲۶، **مؤسسه میان‌فرهنگی متین** نخستین فعالیت عمومی خود را برگزار کرد: پیاده‌روی و گفت‌وگوی میان‌فرهنگی در پارک آنگرینیون، که در تقویم رسمی «هفته دیدارهای میان‌فرهنگی کبک» ثبت شده بود. ۲۱ نفر با وجود باد سرد نوامبر با هم قدم زدند و به زبان فرانسه گفت‌وگو کردند. سه نفر از شرکت‌کنندگان روایت خود را جلوی دوربین بازگو کردند.

title:
  fr: 'L’UNESCO et le MERCOSUR contre le trafic des biens culturels'
  en: 'UNESCO and MERCOSUR against trafficking in cultural property'
  fa: 'یونسکو و مرکوسور در برابر قاچاق اموال فرهنگی'
excerpt:
  fr: 'Une étude de 15 pays d’Amérique latine et des Caraïbes recense plus de 37 000 objets récupérés et 357 restitutions.'
  en: 'A study of 15 Latin American and Caribbean countries counts over 37,000 recovered objects and 357 returns.'
  fa: 'پژوهشی در ۱۵ کشور آمریکای لاتین و کارائیب: بیش از ۳۷ هزار شیء بازیابی‌شده و ۳۵۷ مورد بازگرداندن.'
body:
  fr: |
    Le 30 octobre 2026, l’UNESCO a partagé avec les pays du MERCOSUR ses bonnes pratiques et recommandations pour protéger le patrimoine culturel. Une étude portant sur 15 pays d’Amérique latine et des Caraïbes recense plus de 37 000 objets culturels récupérés et 357 cas de restitution.
  en: |
    On October 30, 2026, UNESCO shared good practices and recommendations with MERCOSUR countries to protect cultural heritage. A study of 15 Latin American and Caribbean countries counts over 37,000 recovered cultural objects and 357 restitution cases.
  fa: |
    یونسکو در ۳۰ اکتبر ۲۰۲۶ تجربه‌ها و توصیه‌های خود را برای حفاظت از میراث فرهنگی با کشورهای مرکوسور در میان گذاشت. پژوهشی در ۱۵ کشور آمریکای لاتین و کارائیب بیش از ۳۷ هزار شیء فرهنگی بازیابی‌شده و ۳۵۷ مورد بازگرداندن به کشور مبدأ را ثبت کرده است.

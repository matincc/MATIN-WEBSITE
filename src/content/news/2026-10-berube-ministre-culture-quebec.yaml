excerpt:
  fr: 'Le nouveau gouvernement de Paul St-Pierre Plamondon confie à Pascal Bérubé la Culture, le Patrimoine, les Communications et la Langue française.'
  en: 'Paul St-Pierre Plamondon’s new government gives Pascal Bérubé the Culture, Heritage, Communications and French Language portfolio.'
  fa: 'دولت تازه پل سن‌پیر پلاموندون، وزارت فرهنگ، میراث، ارتباطات و زبان فرانسه را به پاسکال بروبه سپرد.'
body:
  fr: |
    Le 21 octobre 2026, le premier ministre Paul St-Pierre Plamondon a nommé Pascal Bérubé, député de Matane-Matapédia-Mitis, ministre de la Culture, du Patrimoine, des Communications et de la Langue française. Selon les médias régionaux, le premier ministre lui a demandé de déposer rapidement un projet de loi pour élargir la portée de la Charte de la langue française.
  en: |
    On October 21, 2026, Premier Paul St-Pierre Plamondon named Pascal Bérubé, MNA for Matane-Matapédia-Mitis, Minister of Culture, Heritage, Communications and French Language. Regional media report that the premier asked him to quickly table a bill broadening the reach of the Charter of the French Language.
  fa: |
    در ۲۱ اکتبر ۲۰۲۶، پل سن‌پیر پلاموندون، نخست‌وزیر کبک، پاسکال بروبه، نماینده ماتان-ماتاپدیا-میتیس، را به وزارت فرهنگ، میراث، ارتباطات و زبان فرانسه منصوب کرد. به گزارش رسانه‌های منطقه‌ای، نخست‌وزیر از او خواسته است لایحه‌ای برای گسترش دامنه منشور زبان فرانسه را به‌زودی ارائه کند.

body:
  fr: |
    Le 2 octobre 2026, le gouvernement du Canada a annoncé un financement de 192 000 $ sur deux ans à l’Indigenous Performing Arts Alliance, un organisme national de services aux arts qui regroupe des artistes et des compagnies autochtones de partout au pays. Ce soutien, versé par le Fonds du Canada pour la présentation des arts, appuie ses activités, dont le rassemblement intertribal qu’il tient tous les deux ans.
  en: |
    On October 2, 2026, the Government of Canada announced $192,000 over two years for the Indigenous Performing Arts Alliance, a national arts service organization whose members are Indigenous artists and companies across the country. The support, from the Canada Arts Presentation Fund, goes to its activities, including the Intertribal Gathering it holds every two years.
  fa: |
    دولت کانادا در ۲ اکتبر ۲۰۲۶ اعلام کرد ۱۹۲ هزار دلار در دو سال به اتحادیهٔ هنرهای نمایشی بومیان (Indigenous Performing Arts Alliance) می‌دهد؛ نهادی سراسری که هنرمندان و گروه‌های بومی سراسر کشور را گرد هم آورده است. این کمک از صندوق ارائهٔ هنر کانادا پرداخت می‌شود و به فعالیت‌های آن، از جمله گردهمایی دوسالانهٔ میان‌قبیله‌ای، اختصاص دارد.

  fr: 'Du 29 octobre au 1er novembre, le ballet de Guillaume Côté revisite la comédie de Shakespeare autour d’un mariage, à la salle Wilfrid-Pelletier.'
  en: 'From October 29 to November 1, Guillaume Côté’s ballet reimagines Shakespeare’s comedy around a weekend wedding, at Salle Wilfrid-Pelletier.'
  fa: 'از ۲۹ اکتبر تا ۱ نوامبر، باله گیوم کوته کمدی شکسپیر را در قالب یک جشن عروسی بازآفرینی می‌کند؛ در سالن ویلفرید-پلتیه.'
body:
  fr: |
    Les Grands Ballets présentent Midsummer Night Dreams, une création de Guillaume Côté inspirée du Songe d’une nuit d’été de Shakespeare. Cinq représentations ont lieu du 29 octobre au 1er novembre 2026 à la salle Wilfrid-Pelletier de la Place des Arts.

    Horaires et billets sur le site de la Place des Arts.
  en: |
    Les Grands Ballets present Midsummer Night Dreams, a work by Guillaume Côté inspired by Shakespeare’s A Midsummer Night’s Dream. Five performances take place from October 29 to November 1, 2026, at Salle Wilfrid-Pelletier, Place des Arts.

    Times and tickets are on the Place des Arts website.
  fa: |
    گران باله «رؤیاهای شب نیمه تابستان» را اجرا می‌کند؛ اثری از گیوم کوته که از «رؤیای شب نیمه تابستان» شکسپیر الهام گرفته است. پنج اجرا از ۲۹ اکتبر تا ۱ نوامبر ۲۰۲۶ در سالن ویلفرید-پلتیه پلاس دزار برگزار می‌شود.

    زمان اجراها و بلیت در وب‌سایت پلاس دزار.

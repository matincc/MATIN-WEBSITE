title:
  fr: 'Les écrivains du Québec présentent leurs priorités au nouveau gouvernement'
  en: 'Québec’s writers set out their priorities for the new government'
  fa: 'نویسندگان کبک اولویت‌هایشان را به دولت تازه اعلام کردند'
excerpt:
  fr: 'L’UNEQ demande un filet social pour les artistes, l’encadrement de l’IA et la protection du droit d’auteur.'
  en: 'UNEQ calls for a social safety net for artists, oversight of AI and protection of copyright.'
  fa: 'اتحادیه نویسندگان کبک خواستار شبکه حمایت اجتماعی برای هنرمندان، نظارت بر هوش مصنوعی و حمایت از حق مؤلف شد.'
body:
  fr: |
    L’Union des écrivaines et des écrivains québécois salue le nouveau conseil des ministres et souhaite rencontrer rapidement les ministres de la Culture et de l’Éducation. Elle se réjouit de l’engagement de 8 M$ par année pour l’achat de livres pour les élèves et du maintien du financement du Conseil des arts et des lettres du Québec.
  en: |
    The Union des écrivaines et des écrivains québécois welcomed the new cabinet and wants to meet the culture and education ministers soon. It welcomed the commitment of $8 million a year to buy books for students and the maintained funding of the Conseil des arts et des lettres du Québec.
  fa: |
    اتحادیه نویسندگان کبک (UNEQ) از کابینه تازه استقبال کرد و می‌خواهد به‌زودی با وزیران فرهنگ و آموزش دیدار کند. این اتحادیه از تعهد سالانه ۸ میلیون دلار برای خرید کتاب برای دانش‌آموزان و حفظ بودجه شورای هنر و ادبیات کبک استقبال کرد.

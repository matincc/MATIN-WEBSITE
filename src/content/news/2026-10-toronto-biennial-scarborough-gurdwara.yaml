title:
  fr: 'Une œuvre de la Biennale de Toronto s’installe pour de bon dans un gurdwara sikh'
  en: 'A Toronto Biennial work finds a permanent home at a Sikh gurdwara'
  fa: 'اثری از بی‌ینال تورنتو برای همیشه در یک گوردوارای سیک ماند'
excerpt:
  fr: 'La sculpture de Nirbhai (nep) Singh Sidhu devient une installation permanente au gurdwara de Scarborough.'
  en: 'Nirbhai (nep) Singh Sidhu’s sculpture becomes a permanent installation at the Scarborough Gurdwara.'
  fa: 'مجسمه نیربهای (نپ) سینگ سیدهو به اثری دائمی در گوردوارای اسکاربرو تبدیل شد.'
body:
  fr: |
    L’œuvre A Deathless Potential In Remembrance By You s’inspire de la libération spirituelle (Jivan Mukti) et intègre de la terre d’un gurdwara du Pendjab. Elle relie une communauté de Toronto à son patrimoine, dans le cadre de la Biennale d’art de Toronto, qui se poursuit jusqu’au 20 décembre.
  en: |
    The work, A Deathless Potential In Remembrance By You, draws on spiritual liberation (Jivan Mukti) and includes earth from a gurdwara in Punjab. It links a Toronto community to its heritage, as part of the Toronto Biennial of Art, which runs until December 20.
  fa: |
    این اثر با نام «A Deathless Potential In Remembrance By You» از مفهوم رهایی معنوی (جیوان موکتی) الهام گرفته و خاکی از یک گوردوارا در پنجاب در آن به کار رفته است. این اثر، بخشی از بی‌ینال هنر تورنتو که تا ۲۰ دسامبر ادامه دارد، جامعه‌ای در تورنتو را به میراثش پیوند می‌دهد.

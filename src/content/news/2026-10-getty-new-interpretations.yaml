title:
  fr: 'Getty : 2,7 M$ pour des musées plus accessibles'
  en: 'Getty: $2.7M for more accessible museums'
  fa: 'گتی: ۲٫۷ میلیون دلار برای موزه‌های در دسترس‌تر'
excerpt:
  fr: 'Onze musées soutenus pour les langues, l’accessibilité et le lien avec les communautés, comme des textes d’exposition multilingues.'
  en: 'Eleven museums funded for languages, accessibility and community engagement, such as multilingual wall texts.'
  fa: 'یازده موزه برای چندزبانگی، دسترس‌پذیری و پیوند با جامعه حمایت می‌شوند، مانند متن‌های چندزبانه در نمایشگاه.'
body:
  fr: |
    Le 28 octobre 2026, la Fondation Getty a lancé « New Interpretations », avec une première enveloppe de 2,7 M$ pour onze musées. Les projets portent sur les langues, l’accessibilité et le lien avec les communautés, par exemple des textes d’exposition en plusieurs langues.
  en: |
    On October 28, 2026, the Getty Foundation launched “New Interpretations”, with an initial $2.7M for eleven museums. The projects focus on languages, accessibility and community engagement, such as multilingual wall texts.
  fa: |
    بنیاد گتی در ۲۸ اکتبر ۲۰۲۶ طرح «تفسیرهای تازه» را با بودجهٔ اولیهٔ ۲٫۷ میلیون دلار برای یازده موزه آغاز کرد. این طرح‌ها بر زبان‌ها، دسترس‌پذیری و پیوند با جامعه تمرکز دارند، مانند متن‌های نمایشگاهی به چند زبان.

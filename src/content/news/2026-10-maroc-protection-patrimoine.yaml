title:
  fr: 'Maroc : un accord pour protéger les musées contre le trafic de biens culturels'
  en: 'Morocco signs agreement to protect museums from heritage trafficking'
  fa: 'مراکش برای حفاظت از موزه‌ها در برابر قاچاق میراث فرهنگی توافق امضا کرد'
excerpt:
  fr: 'La police nationale et la Fondation nationale des musées s’unissent contre le vol, la contrefaçon et le trafic illicite.'
  en: 'The national police and the National Foundation of Museums join forces against theft, forgery and illicit trafficking.'
  fa: 'پلیس ملی و بنیاد ملی موزه‌ها در برابر سرقت، جعل و قاچاق غیرقانونی متحد می‌شوند.'
body:
  fr: |
    L’accord signé à Rabat crée une surveillance conjointe, cible les œuvres archéologiques et artistiques contrefaites et renforce la sécurité des musées et du transport des antiquités.
  en: |
    The agreement signed in Rabat sets up joint monitoring, targets counterfeit archaeological and artistic works, and adds security for museums and the transport of antiquities.
  fa: |
    این توافق که در رباط امضا شد، نظارت مشترک ایجاد می‌کند، آثار باستانی و هنری جعلی را هدف می‌گیرد و امنیت موزه‌ها و جابه‌جایی آثار تاریخی را افزایش می‌دهد.

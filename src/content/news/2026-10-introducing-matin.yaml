body:
  en: |
    Culture also takes shape where we live. It is present in the languages we hear on the bus, in a neighbourhood library, in a park on a summer evening, in the shops and community spaces that give a street its character. In Montréal, as across Québec, this everyday cultural diversity is one of the most visible features of public life.

    Yet the places where culture is lived do not always shape the way cultural policies and projects are designed. Whose voices are heard when a neighbourhood plans a cultural space? How can public institutions, cultural organizations and residents of different origins build projects together? How can diversity be reflected not only in what is programmed, but in how decisions are made?

    These questions are at the origin of **Matin Intercultural Institute**, a newly established non-profit organization based in Montréal.

    ## Why Matin

    Matin was created to bring people, organizations and ideas together around culture, intercultural dialogue and community life. Its mission is to promote intercultural dialogue, equity and cultural exchange in Québec, in Canada and internationally.

    We see culture not only as a sector or an industry, but as part of how communities meet, share public space and imagine their future together. Intercultural dialogue, in this sense, is not a single event: it is a way of working that takes time, listening and trust.

    ## Three areas of work

    Matin's work is organized around three areas:

    - **Intercultural dialogue and community engagement:** creating opportunities for dialogue, cultural exchange and meaningful participation among diverse communities.
    - **Cultural planning and community development:** supporting inclusive cultural planning and community-based development, in collaboration with municipalities, public institutions, cultural organizations and local communities.
    - **Research, cultural policy and public dialogue:** exploring questions of cultural diversity, intercultural relations, identity and belonging, and connecting academic perspectives with community experience and public decision-making.

    Arts and cultural activities, such as exhibitions, workshops and community events, are part of this work, as ways of bringing these questions to life.

    ## Working with others

    Matin intends to work with municipalities, cultural organizations, universities and researchers, public institutions and community organizations. Over time, we hope to contribute to thoughtful cultural programs and projects, to research and publications, and to public conversations that help Montréal and Québec reflect on the place of culture in shared life.

    We are at the beginning of this work. Our first activities are being developed, and we would rather build them carefully, with others, than announce more than we can deliver.

    ## Follow and join us

    - Explore our [Events & Cultural Agenda](/en/events/) for selected events in Montréal and Québec.
    - [Subscribe to our newsletter](/en/#newsletter) for occasional updates.
    - If you or your organization would like to collaborate, contribute or simply share an idea, write to us through the [Get Involved](/en/get-involved/) page.

    The next conversation starts with you.
  fr: |
    La culture prend aussi forme là où nous vivons. Elle est présente dans les langues que l’on entend dans l’autobus, dans une bibliothèque de quartier, dans un parc un soir d’été, dans les commerces et les lieux communautaires qui donnent son caractère à une rue. À Montréal, comme partout au Québec, cette diversité culturelle du quotidien est l’un des traits les plus visibles de la vie publique.

    Pourtant, les lieux où la culture se vit n’orientent pas toujours la manière dont les politiques et les projets culturels sont conçus. Quelles voix sont entendues lorsqu’un quartier planifie un lieu culturel ? Comment les institutions publiques, les organismes culturels et les résidentes et résidents de toutes origines peuvent-ils bâtir des projets ensemble ? Comment la diversité peut-elle se refléter non seulement dans ce qui est programmé, mais aussi dans la façon dont les décisions sont prises ?

    Ces questions sont à l’origine de l’**Institut interculturel Matin**, un organisme à but non lucratif nouvellement établi à Montréal.

    ## Pourquoi Matin

    Matin a été créé pour rassembler des personnes, des organismes et des idées autour de la culture, du dialogue interculturel et de la vie des communautés. Sa mission est de promouvoir le dialogue interculturel, l’équité et les échanges culturels au Québec, au Canada et à l’international.

    Nous voyons la culture non seulement comme un secteur ou une industrie, mais comme une part de la façon dont les communautés se rencontrent, partagent l’espace public et imaginent leur avenir ensemble. En ce sens, le dialogue interculturel n’est pas un événement ponctuel : c’est une manière de travailler qui demande du temps, de l’écoute et de la confiance.

    ## Trois champs d’action

    Le travail de Matin s’articule autour de trois champs d’action :

    - **Dialogue interculturel et engagement communautaire :** créer des occasions de dialogue, d’échanges culturels et de participation active entre des communautés diverses.
    - **Planification culturelle et développement des communautés :** soutenir une planification culturelle inclusive et le développement des milieux de vie, en collaboration avec les municipalités, les institutions publiques, les organismes culturels et les communautés locales.
    - **Recherche, politiques culturelles et dialogue public :** explorer les questions de diversité culturelle, de relations interculturelles, d’identité et d’appartenance, et relier les perspectives universitaires, l’expérience des communautés et la prise de décision publique.

    Les arts et les activités culturelles, comme les expositions, les ateliers et les événements communautaires, font partie de ce travail : ils permettent de faire vivre ces questions.

    ## Travailler avec d’autres

    Matin souhaite travailler avec les municipalités, les organismes culturels, les universités et les chercheuses et chercheurs, les institutions publiques et les organismes communautaires. Avec le temps, nous espérons contribuer à des programmes et des projets culturels réfléchis, à la recherche et aux publications, ainsi qu’à des dialogues publics qui aident Montréal et le Québec à réfléchir à la place de la culture dans la vie commune.

    Nous en sommes au début de ce travail. Nos premières activités sont en préparation, et nous préférons les bâtir avec soin, avec d’autres, plutôt que d’annoncer plus que ce que nous pouvons réaliser.

    ## Suivre nos travaux et nous rejoindre

    - Consultez notre [agenda culturel](/fr/evenements/) pour une sélection d’événements à Montréal et au Québec.
    - [Abonnez-vous à notre infolettre](/fr/#newsletter) pour recevoir des nouvelles ponctuelles.
    - Vous souhaitez collaborer, contribuer ou simplement partager une idée, à titre personnel ou au nom d’un organisme ? Écrivez-nous à partir de la page [S’impliquer](/fr/s-impliquer/).

    La prochaine conversation commence avec vous.
  fa: |
    فرهنگ در جایی هم شکل می‌گیرد که در آن زندگی می‌کنیم: در زبان‌هایی که در اتوبوس می‌شنویم، در کتابخانه محله، در پارکی در یک غروب تابستانی، و در مغازه‌ها و فضاهای اجتماعی‌ای که به یک خیابان هویت می‌دهند. در مونترال، مانند همه جای کبک، این تنوع فرهنگیِ روزمره یکی از آشکارترین ویژگی‌های زندگی عمومی است.

    با این حال، جاهایی که فرهنگ در آن‌ها زیسته می‌شود همیشه در شیوه طراحی سیاست‌ها و پروژه‌های فرهنگی بازتاب پیدا نمی‌کنند. وقتی یک محله برای یک فضای فرهنگی برنامه‌ریزی می‌کند، صدای چه کسانی شنیده می‌شود؟ نهادهای عمومی، سازمان‌های فرهنگی و ساکنانی با پیشینه‌های گوناگون چگونه می‌توانند با هم پروژه بسازند؟ تنوع فرهنگی چگونه می‌تواند نه‌فقط در برنامه‌ها، بلکه در شیوه تصمیم‌گیری هم دیده شود؟

    این پرسش‌ها سرآغاز شکل‌گیری **مؤسسه بین‌فرهنگی متین** است؛ سازمانی غیرانتفاعی و تازه‌تأسیس در مونترال.

    ## چرا متین

    متین برای گرد هم آوردن مردم، سازمان‌ها و ایده‌ها پیرامون فرهنگ، گفت‌وگوی بین‌فرهنگی و زندگی اجتماعی شکل گرفته است. مأموریت آن ترویج گفت‌وگوی بین‌فرهنگی، برابری و تبادل فرهنگی در کبک، کانادا و در سطح بین‌المللی است.

    ما فرهنگ را فقط یک بخش یا صنعت نمی‌بینیم، بلکه آن را بخشی از شیوه‌ای می‌دانیم که جوامع با آن با هم روبه‌رو می‌شوند، فضای عمومی را با هم شریک‌اند و آینده مشترکشان را تصور می‌کنند. به این معنا، گفت‌وگوی بین‌فرهنگی یک رویداد یک‌باره نیست؛ شیوه‌ای از کار است که به زمان، شنیدن و اعتماد نیاز دارد.

    ## سه حوزه فعالیت

    کار متین بر سه حوزه استوار است:

    - **گفت‌وگوی بین‌فرهنگی و مشارکت اجتماعی:** فراهم کردن فرصت‌هایی برای گفت‌وگو، تبادل فرهنگی و مشارکت معنادار میان جوامع گوناگون.
    - **برنامه‌ریزی فرهنگی و توسعه اجتماعی:** پشتیبانی از برنامه‌ریزی فرهنگی فراگیر و توسعه اجتماع‌محور، در همکاری با شهرداری‌ها، نهادهای عمومی، سازمان‌های فرهنگی و جوامع محلی.
    - **پژوهش، سیاست‌گذاری فرهنگی و گفت‌وگوی عمومی:** کاوش در پرسش‌های تنوع فرهنگی، روابط بین‌فرهنگی، هویت و تعلق، و پیوند دادن دیدگاه‌های دانشگاهی با تجربه جوامع و تصمیم‌گیری عمومی.

    هنر و فعالیت‌های فرهنگی، مانند نمایشگاه‌ها، کارگاه‌ها و رویدادهای اجتماعی، بخشی از این کارند و راهی برای زنده کردن این پرسش‌ها.

    ## همکاری با دیگران

    متین قصد دارد با شهرداری‌ها، سازمان‌های فرهنگی، دانشگاه‌ها و پژوهشگران، نهادهای عمومی و سازمان‌های اجتماعی همکاری کند. امیدواریم به‌مرور در شکل‌گیری برنامه‌ها و پروژه‌های فرهنگیِ سنجیده، در پژوهش و انتشارات، و در گفت‌وگوهای عمومی‌ای سهیم باشیم که به مونترال و کبک کمک می‌کنند درباره جایگاه فرهنگ در زندگی مشترک بیندیشند.

    ما در آغاز این راه هستیم. نخستین فعالیت‌هایمان در حال شکل‌گیری است و ترجیح می‌دهیم آن‌ها را با دقت و همراه با دیگران بسازیم، نه اینکه بیش از توانمان وعده دهیم.

    ## با ما همراه شوید

    - [برنامه رویدادهای فرهنگی](/en/events/?from=fa) ما را برای گزیده‌ای از رویدادهای مونترال و کبک دنبال کنید.
    - برای دریافت خبرهای گاه‌به‌گاه [عضو خبرنامه ما شوید](/fa/#newsletter).
    - اگر شما یا سازمانتان می‌خواهید همکاری کنید، سهمی داشته باشید یا فقط ایده‌ای را با ما در میان بگذارید، از صفحه [مشارکت](/fa/get-involved/) برایمان بنویسید.

    گفت‌وگوی بعدی با شما آغاز می‌شود.

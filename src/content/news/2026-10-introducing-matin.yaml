body:
  fr: |
    L’Institut interculturel Matin est un nouvel organisme sans but lucratif établi à Montréal, au Québec. Il rassemble des personnes, des organismes et des idées autour de la culture, du dialogue interculturel et de la vie des communautés.

    ## Un organisme québécois sans but lucratif

    Matin a été constitué au Québec le 14 octobre 2026 en tant qu’organisme sans but lucratif. Ses renseignements officiels figurent à la page [Informations légales](/fr/informations-legales/).

    ## Pourquoi Matin

    À Montréal, la diversité culturelle fait partie du quotidien : dans les quartiers, les bibliothèques, les parcs et les lieux communautaires. Pourtant, les résidentes et résidents de toutes origines ne participent pas toujours à la façon dont les projets culturels sont imaginés et décidés. Matin a été créé pour offrir des lieux où les communautés, les organismes culturels et les institutions publiques peuvent se rencontrer, s’écouter et bâtir des projets ensemble.

    ## Notre mission

    > Promouvoir le dialogue interculturel, l'équité et les échanges culturels au Québec, au Canada et à l'international. Nous soutenons l'accueil et la pleine participation des personnes immigrantes, mettons en valeur les arts et le patrimoine des diverses communautés, faisons avancer la recherche et les publications sur l'interculturalité, et renforçons les liens entre les jeunes, les familles et les personnes aînées.

    ## Trois champs d’action

    - **Dialogue interculturel et engagement communautaire**
    - **Planification culturelle et développement des communautés**
    - **Recherche, politiques culturelles et dialogue public**

    Les arts et les activités culturelles, comme les expositions et les événements communautaires, sont l’une des façons de faire vivre ces questions.

    ## Suivre nos travaux

    - Les activités à venir et les choix de Matin sont présentés à la page [Événements](/fr/evenements/).
    - L’infolettre est offerte au bas de chaque page.
    - Pour collaborer ou partager une idée, écrivez-nous à partir de la page [Contact et collaboration](/fr/contact/).
  en: |
    Matin Intercultural Institute is a new non-profit organization based in Montréal, Québec. It brings people, organizations and ideas together around culture, intercultural dialogue and community life.

    ## A Québec non-profit

    Matin was incorporated in Québec on October 14, 2026, as a non-profit organization. Its official details are on the [Legal Information](/en/legal-information/) page.

    ## Why Matin

    In Montréal, cultural diversity is part of everyday life: in neighbourhoods, libraries, parks and community spaces. Yet residents of every origin do not always take part in how cultural projects are imagined and decided. Matin was created to offer places where communities, cultural organizations and public institutions can meet, listen to one another and build projects together.

    ## Our mission

    > To promote intercultural dialogue, equity, and cultural exchange in Québec, Canada, and internationally. We support the welcoming and full participation of immigrants, celebrate the arts and heritage of diverse communities, advance research and publications on interculturality, and strengthen ties between youth, families, and seniors.

    ## Three areas of work

    - **Intercultural Dialogue & Community Engagement**
    - **Cultural Planning & Community Development**
    - **Research, Cultural Policy & Public Dialogue**

    Arts and cultural activities, such as exhibitions and community events, are one of the ways Matin brings these questions to life.

    ## Follow our work

    - Upcoming activities and Matin's Picks are on the [Events](/en/events/) page.
    - The newsletter sign-up is at the bottom of every page.
    - To collaborate or share an idea, write to us on the [Contact & Collaboration](/en/contact/) page.
  fa: |
    مؤسسه میان‌فرهنگی متین سازمانی غیرانتفاعی و تازه‌تأسیس در مونترالِ کبک است. متین مردم، سازمان‌ها و ایده‌ها را پیرامون فرهنگ، گفت‌وگوی بین‌فرهنگی و زندگی اجتماعی گرد هم می‌آورد.

    ## سازمانی غیرانتفاعی در کبک

    متین در ۱۴ اکتبر ۲۰۲۶ به‌عنوان سازمانی غیرانتفاعی در کبک به ثبت رسید. اطلاعات رسمی مؤسسه در صفحهٔ [اطلاعات حقوقی](/fa/legal-information/) آمده است.

    ## چرا متین

    در مونترال، تنوع فرهنگی بخشی از زندگی روزمره است: در محله‌ها، کتابخانه‌ها، پارک‌ها و فضاهای اجتماعی. با این حال، ساکنانی با پیشینه‌های گوناگون همیشه در شکل‌دادن و تصمیم‌گیری دربارهٔ پروژه‌های فرهنگی سهمی ندارند. متین شکل گرفت تا فضاهایی فراهم کند که در آن جوامع، سازمان‌های فرهنگی و نهادهای عمومی با هم دیدار کنند، صدای یکدیگر را بشنوند و پروژه‌ها را با هم بسازند.

    ## مأموریت ما

    > ترویج گفت‌وگوی بین‌فرهنگی، برابری و تبادل فرهنگی در کبک، کانادا و در سطح بین‌المللی. ما از پذیرش و مشارکت کامل مهاجران پشتیبانی می‌کنیم، هنر و میراث جوامع گوناگون را ارج می‌نهیم، پژوهش و انتشارات دربارهٔ میان‌فرهنگی‌بودن را پیش می‌بریم و پیوند میان جوانان، خانواده‌ها و سالمندان را استوارتر می‌کنیم.

    ## سه حوزهٔ فعالیت

    - **گفت‌وگوی بین‌فرهنگی و مشارکت اجتماعی**
    - **برنامه‌ریزی فرهنگی و توسعه اجتماعی**
    - **پژوهش، سیاست‌گذاری فرهنگی و گفت‌وگوی عمومی**

    هنر و فعالیت‌های فرهنگی، مانند نمایشگاه‌ها و رویدادهای اجتماعی، یکی از راه‌هایی است که متین این پرسش‌ها را زنده می‌کند.

    ## با ما همراه شوید

    - فعالیت‌های پیش رو و پیشنهادهای متین در صفحهٔ [رویدادها](/en/events/?from=fa) آمده است.
    - فرم عضویت در خبرنامه در پایین هر صفحه است.
    - برای همکاری یا در میان گذاشتن یک ایده، از صفحهٔ [تماس و همکاری](/fa/contact/) برایمان بنویسید.

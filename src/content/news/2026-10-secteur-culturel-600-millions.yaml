body:
  fr: |
    Selon La Presse Canadienne, des groupes du secteur culturel s’inquiètent du silence du gouvernement libéral sur les 600 millions de dollars promis au milieu. Le détail de leurs demandes est présenté dans l’article original.
  en: |
    According to The Canadian Press, cultural sector groups are growing worried about the Liberal government’s silence on $600 million in promised funding. Their concerns are detailed in the original article.
  fa: |
    به گزارش کانادین پرس، گروه‌های بخش فرهنگ از سکوت دولت لیبرال درباره ۶۰۰ میلیون دلار بودجه وعده‌داده‌شده نگران‌اند. جزئیات در مقاله اصلی آمده است.

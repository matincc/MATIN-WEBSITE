excerpt:
  fr: '36 entreprises créatives canadiennes, sept ententes de plus de 4,2 M$ en médias numériques et arts de la scène.'
  en: '36 Canadian creative companies, seven agreements worth over $4.2M in digital media and the performing arts.'
  fa: '۳۶ شرکت خلاق کانادایی و هفت توافق به ارزش بیش از ۴٫۲ میلیون دلار در رسانهٔ دیجیتال و هنرهای نمایشی.'
body:
  fr: |
    Le 20 octobre 2026, Patrimoine canadien a fait le bilan d’une mission des industries créatives en Chine menée par le ministre Marc Miller : 36 entreprises canadiennes y ont participé et sept ententes d’une valeur de plus de 4,2 M$ ont été conclues, surtout en médias numériques et en arts de la scène.
  en: |
    On October 20, 2026, Canadian Heritage reported on a creative industries mission to China led by Minister Marc Miller: 36 Canadian companies took part and seven agreements worth over $4.2M were signed, mainly in digital media and the performing arts.
  fa: |
    میراث کانادا در ۲۰ اکتبر ۲۰۲۶ از نتیجهٔ سفر هیئت صنایع خلاق به چین به سرپرستی وزیر مارک میلر خبر داد: ۳۶ شرکت کانادایی شرکت کردند و هفت توافق به ارزش بیش از ۴٫۲ میلیون دلار، بیشتر در رسانهٔ دیجیتال و هنرهای نمایشی، بسته شد.

body:
  fr: |
    ![Visuel officiel de la Semaine québécoise des rencontres interculturelles 2026](https://cdn-contenu.quebec.ca/cdn-contenu/immigration/images/SQRI/2026/IMA_SQRI_2026_coverFacebook_851x315_FIN.png)

    *Visuel : ministère de l'Immigration et de l'Intégration du Québec.*

    La Semaine québécoise des rencontres interculturelles, organisée chaque année par le gouvernement du Québec, a lieu du 2 au 8 novembre 2026 sous le thème « Le Québec en commun ». Partout au Québec, des organismes proposent des activités en français qui favorisent les rencontres et le dialogue entre Québécoises et Québécois de toutes origines.

    ## Notre activité : une promenade d'automne à LaSalle

    À l'occasion de la Semaine, l'Institut interculturel Matin vous invite à une promenade d'automne au parc Angrignon, à LaSalle, le **samedi 7 novembre 2026, de 14 h à 14 h 45**. Une occasion simple de marcher ensemble, de faire connaissance et de parler de nos cultures, dans une ambiance conviviale. L'activité est gratuite, ouverte à toutes et à tous, et les échanges se dérouleront en français.

    [Voir les détails de la promenade](/fr/evenements/promenade-automne-2026/)

    ## Pourquoi c'est important pour nous

    Matin est né à Montréal pour rapprocher les personnes de toutes origines. Prendre part à ce grand rendez-vous québécois, c'est affirmer notre attachement au français comme langue commune et notre envie de bâtir, avec nos voisines et nos voisins de LaSalle, un quartier où chacun se sent chez soi.

    Pour en savoir plus sur la Semaine et son calendrier officiel : [quebec.ca](https://www.quebec.ca/immigration/semaine-quebecoise-rencontres-interculturelles).

    Renseignements : [info@matincc.ca](mailto:info@matincc.ca)
  en: |
    ![Official visual of the Semaine québécoise des rencontres interculturelles 2026](https://cdn-contenu.quebec.ca/cdn-contenu/immigration/images/SQRI/2026/IMA_SQRI_2026_coverFacebook_851x315_FIN.png)

    *Visual: Québec Ministère de l'Immigration et de l'Intégration.*

    The Semaine québécoise des rencontres interculturelles (Québec's intercultural encounters week), held every year by the Government of Québec, runs from November 2 to 8, 2026 under the theme “Le Québec en commun.” Across Québec, organizations offer activities in French that bring Quebecers of all origins together to meet and talk.

    ## Our activity: an autumn walk in LaSalle

    For the Week, Matin Intercultural Institute invites you to an autumn walk in Angrignon Park, LaSalle, on **Saturday, November 7, 2026, from 2:00 to 2:45 p.m.** A simple chance to walk together, get to know each other and talk about our cultures in a friendly atmosphere. The activity is free and open to everyone; conversations will be in French.

    [See the walk details](/en/events/autumn-walk-2026/)

    ## Why it matters to us

    Matin was founded in Montréal to bring people of all origins closer together. Taking part in this major Québec event affirms our commitment to French as our common language and our wish to build, with our LaSalle neighbours, a neighbourhood where everyone feels at home.

    More about the Week and its official calendar: [quebec.ca](https://www.quebec.ca/immigration/semaine-quebecoise-rencontres-interculturelles).

    Inquiries: [info@matincc.ca](mailto:info@matincc.ca)
  fa: |
    ![تصویر رسمی هفتهٔ دیدارهای بین‌فرهنگی کبک ۲۰۲۶](https://cdn-contenu.quebec.ca/cdn-contenu/immigration/images/SQRI/2026/IMA_SQRI_2026_coverFacebook_851x315_FIN.png)

    *تصویر: وزارت مهاجرت و ادغام کبک.*

    هفتهٔ دیدارهای بین‌فرهنگی کبک که هر سال دولت کبک برگزار می‌کند، از ۲ تا ۸ نوامبر ۲۰۲۶ با شعار «کبکِ مشترک» (Le Québec en commun) برگزار می‌شود. در سراسر کبک، سازمان‌ها برنامه‌هایی به زبان فرانسه برگزار می‌کنند تا کبکی‌ها از همهٔ خاستگاه‌ها با هم آشنا شوند و گفت‌وگو کنند.

    ## برنامهٔ ما: پیاده‌روی پاییزی در لاسال

    به مناسبت این هفته، مؤسسه میان‌فرهنگی متین شما را به یک پیاده‌روی پاییزی در پارک آنگرینیون لاسال دعوت می‌کند: **شنبه ۷ نوامبر ۲۰۲۶، ساعت ۱۴ تا ۱۴:۴۵**. فرصتی ساده برای قدم زدن با هم، آشنایی و گفت‌وگو دربارهٔ فرهنگ‌هایمان در فضایی صمیمی. شرکت رایگان و برای همه آزاد است و گفت‌وگوها به زبان فرانسه خواهد بود.

    [جزئیات پیاده‌روی](/fa/events/autumn-walk-2026/)

    ## چرا این برای ما مهم است

    متین در مونترال پایه‌گذاری شد تا مردم از همهٔ خاستگاه‌ها را به هم نزدیک‌تر کند. حضور در این رویداد بزرگ کبکی یعنی پایبندی ما به زبان فرانسه به‌عنوان زبان مشترک، و خواست ما برای ساختن محله‌ای در لاسال، همراه با همسایگانمان، که همه در آن احساس خانه کنند.

    دربارهٔ این هفته و تقویم رسمی آن: [quebec.ca](https://www.quebec.ca/immigration/semaine-quebecoise-rencontres-interculturelles)

    برای اطلاعات بیشتر: [info@matincc.ca](mailto:info@matincc.ca)

title:
  fr: 'Danse Danse accueille pour la première fois une compagnie grecque'
  en: 'Danse Danse welcomes a Greek company for the first time'
  fa: 'نخستین حضور یک گروه رقص یونانی در «دانس دانس» مونترال'
excerpt:
  fr: 'Du 28 au 31 octobre, le chorégraphe Christos Papadopoulos présente My Fierce Ignorant Step au Théâtre Maisonneuve, une œuvre sur l’audace de la jeunesse et l’espoir.'
  en: 'From October 28 to 31, choreographer Christos Papadopoulos presents My Fierce Ignorant Step at Théâtre Maisonneuve, a work about the boldness of youth and hope.'
  fa: 'از ۲۸ تا ۳۱ اکتبر، کریستوس پاپادوپولوس، طراح رقص یونانی، اثر «My Fierce Ignorant Step» را در تئاتر مزونوو اجرا می‌کند؛ اثری درباره بی‌باکی جوانی و امید.'
body:
  fr: |
    Danse Danse présente My Fierce Ignorant Step, du chorégraphe grec Christos Papadopoulos, du 28 au 31 octobre 2026 au Théâtre Maisonneuve de la Place des Arts. C’est la première fois que Danse Danse accueille une compagnie grecque.

    Créée en 2025 et présentée à Paris, Madrid, Rome, Amsterdam et Athènes, l’œuvre revisite l’audace de la jeunesse sur une musique originale de Kornilios Selamsis inspirée de l’Axion Esti de Mikis Theodorakis.
  en: |
    Danse Danse presents My Fierce Ignorant Step by Greek choreographer Christos Papadopoulos from October 28 to 31, 2026, at Théâtre Maisonneuve, Place des Arts. It is the first time Danse Danse has presented a Greek company.

    Created in 2025 and toured to Paris, Madrid, Rome, Amsterdam and Athens, the piece revisits the boldness of youth, set to an original score by Kornilios Selamsis drawing on Mikis Theodorakis’s Axion Esti.
  fa: |
    «دانس دانس» اثر «My Fierce Ignorant Step» از کریستوس پاپادوپولوس، طراح رقص یونانی، را از ۲۸ تا ۳۱ اکتبر ۲۰۲۶ در تئاتر مزونوو پلاس دزار اجرا می‌کند. این نخستین بار است که دانس دانس میزبان یک گروه یونانی است.

    این اثر که در سال ۲۰۲۵ ساخته شد و در پاریس، مادرید، رم، آمستردام و آتن به صحنه رفته، به بی‌باکی دوران جوانی می‌پردازد؛ با موسیقی تازه‌ای از کورنیلیوس سلامسیس که از «اکسیون استی» میکیس تئودوراکیس الهام گرفته است.

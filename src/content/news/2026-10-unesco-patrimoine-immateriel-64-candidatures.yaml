title:
  fr: 'Patrimoine immatériel : l’UNESCO examinera 64 candidatures de 82 pays'
  en: 'Intangible heritage: UNESCO to examine 64 nominations from 82 countries'
  fa: 'یونسکو ۶۴ پرونده میراث ناملموس از ۸۲ کشور را بررسی می‌کند'
excerpt:
  fr: 'Deux fois plus de candidatures que l’an dernier, dont 18 multinationales, seront étudiées à Xiamen (Chine) du 30 novembre au 5 décembre.'
  en: 'Twice as many nominations as last year, 18 of them multinational, will be reviewed in Xiamen, China, from November 30 to December 5.'
  fa: 'دو برابر سال گذشته، از جمله ۱۸ پرونده چندملیتی، از ۳۰ نوامبر تا ۵ دسامبر در شیامن چین بررسی می‌شود.'
body:
  fr: |
    Le Comité intergouvernemental pour la sauvegarde du patrimoine culturel immatériel tiendra sa 21e session à Xiamen. L’Eswatini, le Lesotho, le Soudan du Sud et la Tanzanie pourraient y voir inscrire leur premier élément.
  en: |
    The Intergovernmental Committee for the Safeguarding of the Intangible Cultural Heritage holds its 21st session in Xiamen. Eswatini, Lesotho, South Sudan and Tanzania could see their first element inscribed.
  fa: |
    کمیته بین‌دولتی حفاظت از میراث فرهنگی ناملموس بیست‌ویکمین نشست خود را در شیامن برگزار می‌کند. اسواتینی، لسوتو، سودان جنوبی و تانزانیا ممکن است نخستین عنصر خود را به ثبت برسانند.

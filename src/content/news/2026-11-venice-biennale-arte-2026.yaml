  fr: 'Jusqu’au 22 novembre, la 61e Exposition internationale d’art réunit 110 artistes et collectifs et 100 participations nationales, dont sept pays pour la première fois.'
  en: 'Until November 22, the 61st International Art Exhibition brings together 110 artists and collectives and 100 national participations, including seven countries for the first time.'
  fa: 'تا ۲۲ نوامبر، شصت‌ویکمین نمایشگاه بین‌المللی هنر ونیز با ۱۱۰ هنرمند و گروه هنری و ۱۰۰ غرفه ملی، از جمله هفت کشور برای نخستین بار، برپاست.'
body:
  fr: |
    La 61e Exposition internationale d’art de la Biennale de Venise, « In Minor Keys », se termine le 22 novembre 2026. Conçue par la commissaire Koyo Kouoh, décédée en mai 2025, elle a été réalisée par la Biennale selon ses plans. Elle réunit 110 participants invités et 100 participations nationales ; la Guinée, la Guinée équatoriale, Nauru, le Qatar, la Sierra Leone, la Somalie et le Viêt Nam y participent pour la première fois.

    Informations sur le site de la Biennale.
  en: |
    The 61st International Art Exhibition of the Venice Biennale, “In Minor Keys”, closes on November 22, 2026. Conceived by curator Koyo Kouoh, who died in May 2025, it was realised by the Biennale following her plans. It brings together 110 invited participants and 100 national participations; Guinea, Equatorial Guinea, Nauru, Qatar, Sierra Leone, Somalia and Vietnam take part for the first time.

    Information on the Biennale’s website.
  fa: |
    شصت‌ویکمین نمایشگاه بین‌المللی هنر بینال ونیز با عنوان «In Minor Keys» (در کلیدهای مینور) در ۲۲ نوامبر ۲۰۲۶ به پایان می‌رسد. این نمایشگاه را کویو کواوه، کیوریتوری که در مه ۲۰۲۵ درگذشت، طراحی کرد و بینال آن را بر پایه طرح او به اجرا درآورد. ۱۱۰ شرکت‌کننده دعوت‌شده و ۱۰۰ غرفه ملی در آن حضور دارند و گینه، گینه استوایی، نائورو، قطر، سیرالئون، سومالی و ویتنام برای نخستین بار شرکت کرده‌اند.

    اطلاعات در وب‌سایت بینال.

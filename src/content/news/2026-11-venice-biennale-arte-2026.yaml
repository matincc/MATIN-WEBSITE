title:
  fr: 'Dernières semaines de la Biennale de Venise, « In Minor Keys »'
  en: 'Final weeks of the Venice Biennale, “In Minor Keys”'
  fa: 'هفته‌های پایانی بینال هنر ونیز با عنوان «In Minor Keys»'

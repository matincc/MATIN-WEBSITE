title:
  fr: 'Jusqu’à 2 M$ pour conserver les lieux patrimoniaux du Canada'
  en: 'Up to $2 million to conserve Canada’s heritage places'
  fa: 'تا ۲ میلیون دلار برای حفاظت از اماکن تاریخی کانادا'
excerpt:
  fr: 'Parcs Canada ouvre un appel de propositions pour les lieux historiques nationaux, les phares patrimoniaux et les gares ferroviaires patrimoniales.'
  en: 'Parks Canada opens a call for proposals for national historic sites, heritage lighthouses and heritage railway stations.'
  fa: 'پارکس کانادا برای اماکن تاریخی ملی، فانوس‌های دریایی تاریخی و ایستگاه‌های قطار تاریخی فراخوان داده است.'
body:
  fr: |
    Le 27 octobre 2026, Parcs Canada a lancé un appel de propositions pour son Programme national de partage des frais pour les lieux patrimoniaux. Jusqu’à 2 millions de dollars sont prévus pour 2027-2028 afin de conserver et de mettre en valeur des lieux historiques nationaux, des phares patrimoniaux et des gares ferroviaires patrimoniales. Le programme peut rembourser jusqu’à la moitié des coûts admissibles ; les demandes doivent être déposées au plus tard le 8 décembre 2026.
  en: |
    On October 27, 2026, Parks Canada opened a call for proposals for its National Cost-Sharing Program for Heritage Places. Up to $2 million is available for 2027-28 to conserve and present national historic sites, heritage lighthouses and heritage railway stations. The program can cover up to half of eligible costs; applications are due by December 8, 2026.
  fa: |
    پارکس کانادا در ۲۷ اکتبر ۲۰۲۶ فراخوان «برنامهٔ ملی تقسیم هزینه برای اماکن میراثی» را منتشر کرد. تا ۲ میلیون دلار برای سال ۲۰۲۷-۲۰۲۸ در نظر گرفته شده است تا اماکن تاریخی ملی، فانوس‌های دریایی تاریخی و ایستگاه‌های قطار تاریخی حفظ و معرفی شوند. این برنامه می‌تواند تا نیمی از هزینه‌های واجد شرایط را بپردازد و مهلت ارسال درخواست ۸ دسامبر ۲۰۲۶ است.

title:
  fr: 'L’UNESCO réunit artistes et experts sur la créativité humaine à l’ère de l’IA'
  en: 'UNESCO brings artists and experts together on human creativity in the age of AI'
  fa: 'یونسکو هنرمندان و کارشناسان را درباره خلاقیت انسانی در عصر هوش مصنوعی گرد هم می‌آورد'
excerpt:
  fr: 'Le 27 octobre à Paris, un congrès international examine comment l’intelligence artificielle transforme la création et la diversité des expressions culturelles.'
  en: 'On October 27 in Paris, an international congress looks at how artificial intelligence is changing creative work and the diversity of cultural expressions.'
  fa: '۲۷ اکتبر در پاریس، یک کنگره بین‌المللی بررسی می‌کند که هوش مصنوعی چگونه آفرینش هنری و تنوع بیان‌های فرهنگی را دگرگون می‌کند.'
body:
  fr: |
    Le congrès international « Promouvoir la créativité humaine et la diversité des expressions culturelles dans l’environnement numérique » a lieu le 27 octobre 2026 au siège de l’UNESCO à Paris, avec une diffusion en direct. Il s’inscrit dans la Convention de 2005 sur la diversité des expressions culturelles.

    Au programme : des allocutions, dont celle de Jean-Michel Jarre, ambassadeur de bonne volonté de l’UNESCO, et trois tables rondes sur la création à l’ère de l’IA, des systèmes d’IA respectueux des droits et la découvrabilité des contenus culturels.
  en: |
    The international congress “Promoting Human Creativity and the Diversity of Cultural Expressions in the Digital Environment” takes place on October 27, 2026, at UNESCO Headquarters in Paris, with a live webcast. It is part of the work of the 2005 Convention on the Diversity of Cultural Expressions.

    The program includes keynotes, among them UNESCO Goodwill Ambassador Jean-Michel Jarre, and three panels on creativity in the age of AI, rights-respecting AI systems and the discoverability of diverse cultural content.
  fa: |
    کنگره بین‌المللی «ترویج خلاقیت انسانی و تنوع بیان‌های فرهنگی در محیط دیجیتال» در ۲۷ اکتبر ۲۰۲۶ در مقر یونسکو در پاریس برگزار و به‌صورت زنده پخش می‌شود. این کنگره در چارچوب کنوانسیون ۲۰۰۵ درباره تنوع بیان‌های فرهنگی است.

    برنامه شامل سخنرانی‌هایی، از جمله ژان-میشل ژار، سفیر حسن‌نیت یونسکو، و سه میزگرد درباره خلاقیت در عصر هوش مصنوعی، سامانه‌های هوش مصنوعی حقوق‌محور و دیده‌شدن محتوای فرهنگی متنوع است.

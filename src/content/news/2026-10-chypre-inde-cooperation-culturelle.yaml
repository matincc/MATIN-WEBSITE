  fr: chypre-inde-cooperation-culturelle
  en: cyprus-india-cultural-cooperation
title:
  fr: 'Chypre et l’Inde passent à l’action sur leur accord culturel'
  en: 'Cyprus and India move to put their cultural agreement into practice'
  fa: 'قبرس و هند توافق فرهنگی خود را عملی می‌کنند'
excerpt:
  fr: 'L’accord 2026-2030 couvre les arts visuels et de la scène, le patrimoine et les industries créatives.'
  en: 'The 2026–2030 agreement covers visual and performing arts, heritage and the creative industries.'
  fa: 'این توافق ۲۰۲۶ تا ۲۰۳۰ هنرهای تجسمی و نمایشی، میراث و صنایع خلاق را در بر می‌گیرد.'
body:
  fr: |
    Signé lors de la visite d’État du président Nikos Christodoulides à New Delhi en mai 2026, le protocole d’entente prévoit des échanges artistiques et patrimoniaux. Les deux pays veulent le concrétiser d’ici le 65e anniversaire de leurs relations diplomatiques, en 2027.
  en: |
    Signed during President Nikos Christodoulides’ state visit to New Delhi in May 2026, the memorandum of understanding provides for artistic and heritage exchanges. Both countries want to put it into practice ahead of the 65th anniversary of their diplomatic relations in 2027.
  fa: |
    این تفاهم‌نامه که در سفر رسمی نیکوس خریستودولیدس به دهلی نو در مه ۲۰۲۶ امضا شد، تبادل‌های هنری و میراثی را پیش‌بینی می‌کند. دو کشور می‌خواهند پیش از شصت‌وپنجمین سالگرد روابط دیپلماتیک خود در ۲۰۲۷ آن را اجرایی کنند.

body:
  fr: |
    Le Festival du Jour des Morts d’Ottawa célèbre son 10e anniversaire les 31 octobre et 1er novembre 2026 au marché By. Gratuit et familial, il propose musique, danse folklorique, marché d’artisans, ateliers culinaires, procession et exposition d’ofrendas.

    Programme sur le site du festival.
  en: |
    Ottawa’s Day of the Dead Festival celebrates its 10th anniversary on October 31 and November 1, 2026, in the ByWard Market. Free and family-friendly, it offers music, folk dance, an artisan market, food workshops, a procession and an exhibition of ofrendas.

    The program is on the festival’s website.
  fa: |
    جشنواره روز مردگان اتاوا دهمین سالگرد خود را ۳۱ اکتبر و ۱ نوامبر ۲۰۲۶ در بازار بای‌وارد جشن می‌گیرد. این جشنواره رایگان و خانوادگی شامل موسیقی، رقص محلی، بازارچه صنایع دستی، کارگاه آشپزی، راهپیمایی و نمایشگاه محراب‌های یادبود (اوفرندا) است.

    برنامه در وب‌سایت جشنواره.

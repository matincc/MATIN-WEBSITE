body:
  fr: |
    L'Institut interculturel Matin protège vos renseignements personnels conformément à la *Loi sur la protection des renseignements personnels dans le secteur privé* du Québec (Loi 25).

    ## Personne responsable

    {{privacyOfficer}}

    ## Ce que nous recueillons et pourquoi

    Nous recueillons seulement ce que vous nous transmettez par nos formulaires (contact, adhésion, bénévolat, infolettre, inscription à une activité, vidéo « Mon histoire ») : par exemple votre nom, votre courriel et votre message. Ces renseignements servent uniquement à vous répondre, à gérer votre demande et à vous tenir informé si vous l'avez demandé. Nous ne les vendons ni ne les louons jamais.

    ## Fournisseurs de services

    Pour faire fonctionner le site, nous utilisons quelques fournisseurs reconnus (hébergement du site et des formulaires, courriel et stockage sécurisé de nos dossiers, envoi de l'infolettre). Certains de ces services sont situés à l'extérieur du Québec, notamment aux États-Unis. Nous les choisissons parce qu'ils offrent une protection adéquate de vos renseignements.

    ## Témoins (cookies)

    Le site n'utilise aucun témoin non essentiel sans votre consentement. Les vidéos externes ne se chargent que si vous cliquez dessus.

    ## Conservation et sécurité

    Nous conservons vos renseignements seulement le temps nécessaire aux fins indiquées, puis nous les détruisons de façon sécuritaire. Seules les personnes qui en ont besoin y ont accès.

    ## Vos droits

    Vous pouvez demander à consulter, corriger ou supprimer vos renseignements, ou retirer votre consentement, en écrivant à la personne responsable ci-dessus. Nous répondons dans un délai de 30 jours. Vous pouvez aussi vous adresser à la [Commission d'accès à l'information du Québec](https://www.cai.gouv.qc.ca/).

    ## Incident de confidentialité

    En cas d'incident présentant un risque de préjudice sérieux, nous avisons les personnes concernées et la Commission d'accès à l'information.

    ## Modifications

    Toute modification de cette politique est publiée sur cette page, avec sa date.
  en: |
    Matin Intercultural Institute protects your personal information in accordance with Québec's *Act respecting the protection of personal information in the private sector* (Law 25).

    ## Person in charge

    {{privacyOfficer}}

    ## What we collect and why

    We only collect what you send us through our forms (contact, membership, volunteering, newsletter, event sign-up, "My Story" video): for example your name, your email and your message. This information is used only to answer you, handle your request and keep you informed if you asked us to. We never sell or rent it.

    ## Service providers

    To run the website, we use a few well-known providers (website and form hosting, email and secure storage of our records, newsletter delivery). Some of these services are located outside Québec, including in the United States. We choose them because they offer adequate protection of your information.

    ## Cookies

    The website uses no non-essential cookies without your consent. External videos only load if you click on them.

    ## Retention and security

    We keep your information only as long as needed for the purposes above, then destroy it securely. Only the people who need it have access to it.

    ## Your rights

    You may ask to see, correct or delete your information, or withdraw your consent, by writing to the person in charge above. We reply within 30 days. You may also contact the [Commission d'accès à l'information du Québec](https://www.cai.gouv.qc.ca/).

    ## Privacy incidents

    If an incident presents a risk of serious harm, we notify the people concerned and the Commission d'accès à l'information.

    ## Changes

    Any change to this policy is published on this page, with its date.

    *In case of any difference between versions, the French version prevails.*
  fa: |
    > این متن ترجمهٔ فارسی برای آگاهی است. در صورت هرگونه اختلاف، نسخهٔ فرانسوی ملاک است.

    مؤسسه میان‌فرهنگی متین از اطلاعات شخصی شما مطابق با *قانون حفاظت از اطلاعات شخصی در بخش خصوصی* کبک (قانون ۲۵) محافظت می‌کند.

    ## مسئول حفاظت از اطلاعات

    {{privacyOfficer}}

    ## چه اطلاعاتی گردآوری می‌کنیم و چرا

    ما فقط اطلاعاتی را گردآوری می‌کنیم که خودتان از طریق فرم‌های سایت (تماس، عضویت، داوطلبی، خبرنامه، ثبت‌نام در برنامه‌ها، ویدیوی «داستان من») برای ما می‌فرستید؛ برای نمونه نام، ایمیل و پیامتان. این اطلاعات فقط برای پاسخ به شما، پیگیری درخواستتان و در صورت تمایل، باخبر کردن شما به کار می‌رود. ما هرگز آن را نمی‌فروشیم یا اجاره نمی‌دهیم.

    ## ارائه‌دهندگان خدمات

    برای کار کردن سایت از چند ارائه‌دهندهٔ شناخته‌شده استفاده می‌کنیم (میزبانی سایت و فرم‌ها، ایمیل و نگهداری امن پرونده‌ها، ارسال خبرنامه). برخی از این خدمات بیرون از کبک، از جمله در ایالات متحده، قرار دارند. آن‌ها را به این دلیل برگزیده‌ایم که از اطلاعات شما به‌خوبی محافظت می‌کنند.

    ## کوکی‌ها

    سایت بدون رضایت شما هیچ کوکی غیرضروری‌ای به کار نمی‌برد. ویدیوهای بیرونی فقط وقتی بارگذاری می‌شوند که روی آن‌ها کلیک کنید.

    ## نگهداری و امنیت

    اطلاعات شما را فقط تا زمانی که برای همین اهداف لازم است نگه می‌داریم و سپس به‌طور امن از بین می‌بریم. فقط کسانی که به آن نیاز دارند به آن دسترسی دارند.

    ## حقوق شما

    می‌توانید با نوشتن به مسئول یادشده در بالا، درخواست کنید اطلاعاتتان را ببینید، اصلاح یا حذف کنید، یا رضایت خود را پس بگیرید. ما ظرف ۳۰ روز پاسخ می‌دهیم. همچنین می‌توانید به [کمیسیون دسترسی به اطلاعات کبک](https://www.cai.gouv.qc.ca/) مراجعه کنید.

    ## رخداد امنیتی

    اگر رخدادی پیش آید که خطر آسیب جدی داشته باشد، به افراد مربوط و کمیسیون دسترسی به اطلاعات اطلاع می‌دهیم.

    ## تغییرات

    هر تغییری در این سیاست، همراه با تاریخ آن، در همین صفحه منتشر می‌شود.

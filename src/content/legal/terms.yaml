body:
  fr: |
    En utilisant le site de l'Institut interculturel Matin, vous acceptez les conditions suivantes.

    ## Contenu du site

    Les textes, photos, logos et autres contenus du site appartiennent à Matin ou à leurs auteurs respectifs. Toute reproduction à des fins commerciales est interdite sans autorisation écrite. Le partage à des fins non commerciales est permis avec mention de la source.

    ## Exactitude de l'information

    Nous faisons de notre mieux pour garder l'information à jour (horaires, tarifs, événements). Des changements peuvent toutefois survenir; en cas de doute, communiquez avec nous.

    ## Liens externes

    Le site contient des liens vers d'autres sites (plateformes de dons, ressources gouvernementales, partenaires). Matin n'est pas responsable de leur contenu ni de leurs pratiques en matière de confidentialité.

    ## Inscriptions et dons

    Les inscriptions et les dons en ligne sont traités par des plateformes externes qui ont leurs propres conditions.

    ## Droit applicable

    Ces conditions sont régies par les lois du Québec et du Canada.
  en: |
    By using the Matin Intercultural Institute website, you agree to the following terms.

    ## Site content

    The text, photos, logos and other content on this site belong to Matin or their respective authors. Commercial reproduction is prohibited without written permission. Non-commercial sharing is allowed with credit to the source.

    ## Accuracy of information

    We do our best to keep information up to date (schedules, fees, events). Changes may nevertheless occur; if in doubt, contact us.

    ## External links

    The site contains links to other sites (donation platforms, government resources, partners). Matin is not responsible for their content or privacy practices.

    ## Registrations and donations

    Online registrations and donations are processed by external platforms with their own terms.

    ## Governing law

    These terms are governed by the laws of Québec and Canada.
  fa: |
    > این متن ترجمهٔ فارسی برای آگاهی است. در صورت هرگونه اختلاف، نسخهٔ فرانسوی ملاک است.

    با استفاده از وب‌سایت مؤسسه میان‌فرهنگی متین، شرایط زیر را می‌پذیرید.

    ## محتوای سایت

    متن‌ها، عکس‌ها، نشان‌ها و دیگر محتوای این سایت متعلق به متین یا پدیدآورندگان آن‌هاست. هرگونه بازتولید با هدف تجاری بدون اجازهٔ کتبی ممنوع است. هم‌رسانی غیرتجاری با ذکر منبع مجاز است.

    ## درستی اطلاعات

    ما تمام تلاش خود را می‌کنیم تا اطلاعات (زمان‌بندی‌ها، هزینه‌ها، رویدادها) به‌روز بماند. با این حال ممکن است تغییراتی پیش بیاید؛ در صورت تردید با ما تماس بگیرید.

    ## پیوندهای بیرونی

    این سایت پیوندهایی به سایت‌های دیگر (سکوهای کمک مالی، منابع دولتی، شرکا) دارد. متین مسئول محتوای آن‌ها یا شیوهٔ حفظ حریم خصوصی آن‌ها نیست.

    ## ثبت‌نام‌ها و کمک‌های مالی

    ثبت‌نام‌ها و کمک‌های مالی برخط از طریق سکوهای بیرونی انجام می‌شود که شرایط خاص خود را دارند.

    ## قانون حاکم

    این شرایط تابع قوانین کبک و کاناداست.

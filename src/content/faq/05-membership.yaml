# FAQ drafted by Claude at the owner's request (Oct 30 2026), for his review.
topic: general
order: 5
question:
  fr: 'Comment devenir membre ? Est-ce payant ?'
  en: 'How do I become a member? Is there a fee?'
  fa: 'چطور عضو شوم؟ هزینه دارد؟'
answer:
  fr: "L'adhésion est gratuite jusqu'au 31 décembre 2027. Il suffit de remplir le formulaire d'adhésion sur la page « Devenir membre »."
  en: 'Membership is free until December 31, 2027. Simply fill in the membership form on the "Become a Member" page.'
  fa: 'عضویت تا ۳۱ دسامبر ۲۰۲۷ رایگان است. کافی است فرم عضویت را در صفحهٔ «عضویت» پر کنید.'

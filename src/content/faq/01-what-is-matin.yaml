# FAQ drafted by Claude at the owner's request (Oct 30 2026), for his review.
topic: general
order: 1
question:
  fr: "Qu'est-ce que l'Institut interculturel Matin ?"
  en: 'What is Matin Intercultural Institute?'
  fa: 'مؤسسه میان‌فرهنگی متین چیست؟'
answer:
  fr: "L'Institut interculturel Matin est un organisme sans but lucratif montréalais qui rapproche les personnes et les communautés de différentes cultures par le dialogue, les échanges culturels et l'apprentissage partagé."
  en: 'Matin Intercultural Institute is a Montréal nonprofit organization that brings people and communities of different cultures together through dialogue, cultural exchange and shared learning.'
  fa: 'مؤسسه میان‌فرهنگی متین یک سازمان غیرانتفاعی در مونترال است که مردم و جامعه‌هایی از فرهنگ‌های گوناگون را از راه گفت‌وگو، تبادل فرهنگی و یادگیری مشترک به هم نزدیک می‌کند.'

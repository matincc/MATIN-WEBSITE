# FAQ drafted by Claude at the owner's request (Oct 30 2026), for his review.
topic: events
order: 4
question:
  fr: 'Les activités sont-elles payantes ? Comment confirmer ma présence ?'
  en: 'Do the activities cost anything? How do I confirm my attendance?'
  fa: 'آیا برنامه‌ها هزینه دارند؟ چطور حضورم را اعلام کنم؟'
answer:
  fr: "Nos activités actuelles sont gratuites. Le prix, s'il y en a un, est toujours indiqué sur la page de l'activité. Pour nous dire que vous venez, remplissez le court formulaire « Je participe » sur cette page."
  en: 'Our current activities are free. Any price is always shown on the activity''s page. To let us know you are coming, fill in the short "I''m Coming" form on that page.'
  fa: 'برنامه‌های فعلی ما رایگان‌اند. اگر برنامه‌ای هزینه داشته باشد، همیشه در صفحهٔ همان برنامه نوشته می‌شود. برای اعلام حضور، فرم کوتاه «من می‌آیم» را در همان صفحه پر کنید.'

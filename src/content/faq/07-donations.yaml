# FAQ drafted by Claude at the owner's request (Oct 30 2026), for his review.
topic: donations
order: 7
question:
  fr: 'Puis-je faire un don ? Vais-je recevoir un reçu fiscal ?'
  en: 'Can I make a donation? Will I receive a tax receipt?'
  fa: 'آیا می‌توانم کمک مالی کنم؟ رسید مالیاتی دریافت می‌کنم؟'
answer:
  fr: "Les dons en ligne seront bientôt possibles sur la page « Soutenir Matin ». En attendant, écrivez-nous. Matin est un organisme sans but lucratif, mais il n'est pas un organisme de bienfaisance enregistré : il ne peut donc pas remettre de reçus aux fins de l'impôt."
  en: 'Online donations will soon be possible on the "Support Matin" page. In the meantime, please write to us. Matin is a nonprofit organization but not a registered charity, so it cannot issue receipts for income tax purposes.'
  fa: 'به‌زودی امکان کمک مالی آنلاین در صفحهٔ «حمایت از متین» فراهم می‌شود. تا آن زمان به ما بنویسید. متین سازمانی غیرانتفاعی است، اما مؤسسهٔ خیریهٔ ثبت‌شده نیست و بنابراین نمی‌تواند رسید مالیاتی صادر کند.'

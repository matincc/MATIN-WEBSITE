# FAQ drafted by Claude at the owner's request (Oct 30 2026), for his review.
topic: volunteering
order: 6
question:
  fr: 'Puis-je être bénévole, même si je ne vis pas à Montréal ?'
  en: "Can I volunteer, even if I don't live in Montréal?"
  fa: 'آیا می‌توانم داوطلب شوم، حتی اگر در مونترال زندگی نمی‌کنم؟'
answer:
  fr: "Oui. Vous pouvez contribuer en personne à Montréal ou en ligne, où que vous soyez dans le monde. Remplissez le formulaire de bénévolat sur la page « Contact et collaboration »."
  en: 'Yes. You can contribute in person in Montréal or online, wherever you are in the world. Fill in the volunteer form on the "Contact & Collaboration" page.'
  fa: 'بله. می‌توانید حضوری در مونترال یا آنلاین از هر جای دنیا همکاری کنید. فرم داوطلبی را در صفحهٔ «تماس و همکاری» پر کنید.'

# FAQ drafted by Claude at the owner's request (Oct 30 2026), for his review.
topic: general
order: 2
question:
  fr: 'Qui peut participer aux activités de Matin ?'
  en: "Who can take part in Matin's activities?"
  fa: 'چه کسانی می‌توانند در برنامه‌های متین شرکت کنند؟'
answer:
  fr: "Tout le monde. Nos activités sont ouvertes à toutes et à tous, quelles que soient leur origine, leur langue maternelle ou leurs convictions. Matin est un organisme non partisan."
  en: 'Everyone. Our activities are open to all, whatever their background, mother tongue or beliefs. Matin is a non-partisan organization.'
  fa: 'همه. برنامه‌های ما برای همه آزاد است، با هر پیشینه، زبان مادری یا باوری. متین سازمانی غیرحزبی است.'

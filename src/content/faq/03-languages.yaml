# FAQ drafted by Claude at the owner's request (Oct 30 2026), for his review.
topic: general
order: 3
question:
  fr: 'Dans quelle langue se déroulent les activités ?'
  en: 'What language are the activities in?'
  fa: 'برنامه‌ها به چه زبانی برگزار می‌شوند؟'
answer:
  fr: "Nos activités se déroulent surtout en français. La langue de chaque activité est indiquée sur sa page. Vous pouvez nous écrire en français, en anglais ou en persan."
  en: 'Our activities take place mainly in French. The language of each activity is shown on its page. You can write to us in French, English or Persian.'
  fa: 'برنامه‌های ما بیشتر به زبان فرانسوی برگزار می‌شوند. زبان هر برنامه در صفحهٔ همان برنامه نوشته شده است. می‌توانید به فرانسوی، انگلیسی یا فارسی به ما بنویسید.'

mission:
  fr: "Promouvoir le dialogue interculturel, l'équité et les échanges culturels au Québec, au Canada et à l'international. Nous soutenons l'accueil et la pleine participation des personnes immigrantes, mettons en valeur les arts et le patrimoine des diverses communautés, faisons avancer la recherche et les publications sur l'interculturalité, et renforçons les liens entre les jeunes, les familles et les personnes aînées."
  en: 'To promote intercultural dialogue, equity, and cultural exchange in Québec, Canada, and internationally. We support the welcoming and full participation of immigrants, celebrate the arts and heritage of diverse communities, advance research and publications on interculturality, and strengthen ties between youth, families, and seniors.'
phone: '+1 263 378-9340'
